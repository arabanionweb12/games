<title>The Yamma Deal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  color-scheme: light;
  --sky:#3AB8FF; --sun:#FFD23F; --pink:#FF4D8D; --lime:#7BD23A; --grape:#7B4DFF; --orange:#FF8A1F;
  --ink:#1B1740; --paper:#FFFBF2; --card:#FFFFFF; --soft:#EAF6FF; --line:#1B1740;
  --ui:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --ar:"Noto Naskh Arabic", "Geeza Pro", "Arial", serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--ui);font-size:17px;
  background-image:radial-gradient(circle at 12% 18%, #ffffff55 0 60px, transparent 61px),radial-gradient(circle at 88% 8%, #ffffff44 0 90px, transparent 91px),radial-gradient(circle at 70% 92%, #ffffff33 0 120px, transparent 121px);
  background-attachment:fixed}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;font-weight:700;line-height:1.7}
button{font-family:var(--ui);cursor:pointer;color:var(--ink)}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:28px;color:#fff;text-shadow:3px 3px 0 var(--ink);letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.logo small{font-size:15px;background:var(--sun);color:var(--ink);text-shadow:none;border:3px solid var(--ink);border-radius:999px;padding:0 10px}
.pill{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:800;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;gap:8px}
.btn{border:3px solid var(--ink);border-radius:18px;padding:10px 18px;font-weight:800;font-size:18px;background:var(--sun);box-shadow:0 5px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff}.btn.lime{background:var(--lime)}.btn.grape{background:var(--grape);color:#fff}.btn.white{background:#fff}.btn.sky{background:var(--sky);color:#fff}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:20px}
h1,h2,h3{margin:0 0 8px;line-height:1.15}
h2{font-size:30px}
.sub{font-size:18px;opacity:.85;margin:0 0 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.grid{display:grid;gap:14px}
/* map */
.map{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.lvl{position:relative;border:4px solid var(--ink);border-radius:24px;padding:16px 14px 12px;text-align:left;box-shadow:0 6px 0 var(--ink);min-height:150px;display:flex;flex-direction:column;gap:4px;transition:transform .12s}
.lvl:hover{transform:translateY(-3px) rotate(-.5deg)}
.lvl .em{font-size:46px;line-height:1}
.lvl .nm{font-size:21px;font-weight:800}
.lvl .ds{font-size:15px;opacity:.85}
.lvl .st{position:absolute;top:10px;right:12px;font-size:18px}
.lvl .no{position:absolute;bottom:10px;right:14px;font-weight:800;font-size:14px;opacity:.6}
/* stage */
.stage{width:100%;aspect-ratio:16/9;border:4px solid var(--ink);border-radius:24px;overflow:hidden;background:#fff;display:block}
.bigq{font-size:24px;font-weight:800;margin:16px 0 10px}
.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.choice{font-size:54px;width:110px;height:110px;border:4px solid var(--ink);border-radius:26px;background:#fff;box-shadow:0 6px 0 var(--ink)}
.choice.no{animation:shake .4s;background:#ffd6e4}
.choice.yes{background:var(--lime)}
.reveal{margin-top:16px;background:#fff;border:4px dashed var(--grape);border-radius:24px;padding:16px;text-align:center}
.reveal .ar{font-size:clamp(30px,6vw,52px);color:var(--ink)}
.say{display:inline-flex;gap:8px;align-items:center;background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:800;margin:6px 0}
.bubble{position:relative;display:inline-block;background:#fff;border:4px solid var(--ink);border-radius:26px;padding:6px 20px;box-shadow:0 5px 0 var(--ink)}
.bubble.mom{background:#FFE1EC}
.bubble .ar{font-size:clamp(24px,5vw,40px)}
/* cards */
.cards{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.card{border:4px solid var(--ink);border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--ink);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:112px;justify-content:center}
.card .e{font-size:34px;line-height:1.1}
.card .ar{font-size:21px;line-height:1.5;text-align:center}
.card.used{opacity:.45;transform:scale(.96)}
.card.sel{background:var(--sun)}
.meter{height:26px;border:4px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.meter i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--pink) 0 14px,#ff72a6 14px 28px);transition:width .5s}
.meter.hp i{background:repeating-linear-gradient(45deg,#ff5a5a 0 14px,#ff7b7b 14px 28px)}
/* memory */
.mem{grid-template-columns:repeat(4,1fr)}
.mc{aspect-ratio:1/1;border:4px solid var(--ink);border-radius:18px;background:var(--grape);box-shadow:0 5px 0 var(--ink);font-size:30px;color:#fff;display:flex;align-items:center;justify-content:center;padding:6px}
.mc.open{background:#fff;color:var(--ink)}
.mc.done{background:var(--lime);color:var(--ink)}
.mc .ar{font-size:clamp(14px,2.6vw,22px);line-height:1.4}
@media (max-width:560px){.mem{grid-template-columns:repeat(3,1fr)}}
/* combo */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:rtl}
.slot{border:4px dashed var(--ink);border-radius:20px;min-height:110px;background:#ffffffaa;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center}
.slot .t{font-family:var(--ui);direction:ltr;font-weight:800;font-size:13px;opacity:.7}
.slot.f{border-style:solid;background:#fff}
.slot .ar{font-size:18px;line-height:1.45}
@media (max-width:640px){.slots{grid-template-columns:repeat(2,1fr)}}
.tray h3{font-size:18px;margin:14px 0 6px}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:2px 14px;box-shadow:0 3px 0 var(--ink)}
.chip .ar{font-size:19px}
.chip.on{background:var(--sun)}
/* boss */
.boss{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:center}
@media (max-width:700px){.boss{grid-template-columns:1fr}}
.opt{width:100%;text-align:center;border:4px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--ink);padding:6px 12px;margin-bottom:10px}
.opt .ar{font-size:24px}
.opt.no{animation:shake .4s;background:#ffd6e4}
.opt.yes{background:var(--lime)}
.hit{animation:hit .5s}
.laugh{animation:wobble .6s}
/* rap */
.karaoke{background:var(--ink);border-radius:24px;padding:20px;color:#fff;text-align:center;min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.karaoke .line{font-family:var(--ar);direction:rtl;font-size:clamp(26px,5vw,44px);font-weight:700;line-height:1.6}
.karaoke .line span{padding:0 6px;border-radius:12px;transition:background .1s,color .1s}
.karaoke .line span.now{background:var(--sun);color:var(--ink)}
.karaoke .next{font-family:var(--ar);direction:rtl;font-size:22px;opacity:.55}
.beatdots{display:flex;gap:8px;justify-content:center}
.beatdots i{width:16px;height:16px;border-radius:50%;background:#ffffff33}
.beatdots i.on{background:var(--pink)}
/* wish */
.wishes{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.wish{border:4px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:8px 6px;display:flex;flex-direction:column;align-items:center}
.wish .e{font-size:36px}
.wish .ar{font-size:17px;text-align:center;line-height:1.5}
.wish.on{background:var(--sun)}
.dealbox{background:#fff;border:4px solid var(--ink);border-radius:24px;padding:14px;text-align:center}
.dealbox .ar{font-size:clamp(22px,4.5vw,34px);line-height:1.8}
input[type=text]{font-family:var(--ui);font-size:18px;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;width:100%;max-width:360px}
input.arin{font-family:var(--ar);direction:rtl}
.steps{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.step{background:#fff;border:4px solid var(--ink);border-radius:22px;padding:14px;text-align:center;box-shadow:0 5px 0 var(--ink)}
.step .e{font-size:44px}
.back{margin-bottom:12px}
.hide{display:none!important}
.gate{position:fixed;inset:0;background:#1B1740cc;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.gatebox{background:var(--sun);border:5px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 var(--ink);padding:22px;max-width:520px;width:100%;text-align:center}
.gatebox h2{font-size:48px;margin:0}
input.bad{animation:shake .4s;border-color:#e0245e}
video.stage{background:#000;object-fit:contain}
.spk{border:3px solid var(--ink);border-radius:50%;width:44px;height:44px;background:var(--sun);box-shadow:0 3px 0 var(--ink);font-size:20px;vertical-align:middle;margin:0 6px;flex:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-weight:800;z-index:50}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
/* avatar picker */
.pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sw{width:54px;height:54px;border-radius:50%;border:4px solid var(--ink)}
.sw.on{outline:5px solid #fff;outline-offset:2px}
.hairb{padding:6px 12px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:800}
.hairb.on{background:var(--sun)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes hit{0%{transform:translateX(0)}20%{transform:translateX(-14px) rotate(-4deg)}40%{transform:translateX(12px) rotate(3deg)}60%{transform:translateX(-6px)}100%{transform:none}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(5deg)}75%{transform:rotate(-5deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
.popin{animation:pop .45s both}
/* scene svg animations */
.stage .a-bounce{animation:bounce 1s ease-in-out infinite}
.stage .a-sway{animation:sway 2.4s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
.stage .a-think{opacity:0;animation:pop .5s both;animation-delay:2.4s;transform-box:fill-box;transform-origin:50% 100%}
.stage .a-think2{opacity:0;animation:pop .5s both;animation-delay:1.6s;transform-box:fill-box;transform-origin:50% 100%}
.stage .a-drop{animation:drop 1.4s ease-in infinite}
.stage .a-shake{animation:shake .25s linear infinite}
.stage .a-rise{animation:rise 3s ease-out both}
.stage .a-spin{animation:spin 2s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.stage .a-blink{animation:blink 1s steps(2) infinite}
.stage .a-float{animation:float 2s ease-in-out infinite}
.stage .a-walk{animation:walk 3s ease-in-out both}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-40px)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes drop{0%{transform:translateY(-60px);opacity:0}20%{opacity:1}100%{transform:translateY(80px);opacity:0}}
@keyframes rise{0%{transform:translateY(90px)}100%{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.2}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes walk{0%{transform:translateX(-160px)}100%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

</head>

let ac=null;
function A(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,d=.15,type='sine',v=.25,when=0,slide){const a=A();if(!a)return;const t=a.currentTime+when;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d=.1,v=.3,when=0,hp=0){const a=A();if(!a)return;const t=a.currentTime+when;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate);const c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);let n=s;if(hp){const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;s.connect(f);n=f}n.connect(g).connect(a.destination);s.start(t)}
const SFX={
  ding(){tone(880,.12,'sine',.3);tone(1320,.25,'sine',.25,.1)},
  buzz(){tone(140,.25,'square',.15)},
  pop(){tone(600,.08,'triangle',.25,0,1200)},
  coin(){tone(988,.08,'square',.12);tone(1319,.3,'square',.12,.08)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.25,i*.12));tone(1047,.6,'sine',.2,.5)},
  growl(){tone(90,.9,'sawtooth',.12,0,60);tone(70,.6,'sawtooth',.1,.5,50)},
  ring(){for(let i=0;i<4;i++){tone(1300,.08,'square',.08,i*.18);tone(1000,.08,'square',.08,i*.18+.09)}},
  whoosh(){noise(.35,.2,0,800)},
  boing(){tone(200,.35,'sine',.3,0,500)},
  cheer(){noise(.9,.12,0,1500);[784,988,1175].forEach((f,i)=>tone(f,.15,'square',.08,i*.1))},
  laugh(){[0,.16,.32].forEach(t=>tone(420,.1,'sawtooth',.1,t,300))},
  kick(w){tone(150,.18,'sine',.9,w,40)},
  snare(w){noise(.14,.35,w,1000);tone(190,.08,'triangle',.25,w)},
  hat(w){noise(.04,.15,w,7000)},
};

function confetti(){const c=document.getElementById('confetti');const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#FFD23F','#FF4D8D','#3AB8FF','#7BD23A','#7B4DFF','#FF8A1F'];const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:5+Math.random()*7,c:cols[Math.random()*6|0],vy:2+Math.random()*4,vx:-2+Math.random()*4,a:Math.random()*6}));let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++f<170)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})()}

/* ---- 1. Hesham TV ---- */
function watch(i=0){
  const sc=SCENES[i];
  scr().innerHTML=`${backBtn}<div class="panel">
    <div class="row" style="justify-content:space-between"><h2>📺 Hesham TV · Episode ${i+1}/${SCENES.length}</h2><div class="row">${SCENES.map((_,k)=>`<button class="btn ${k===i?'pink':'white'}" style="padding:2px 12px;font-size:16px" onclick="watch(${k})">${k+1}</button>`).join('')}</div></div>
    ${VIDEOS['ep_'+sc.id]?vid('ep_'+sc.id,'id="stv"'):'<svg class="stage" viewBox="0 0 640 360" id="stg"></svg>'}
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn sky" id="play">▶ Play episode</button></div>
    <div id="ask" class="hide center"><div class="bigq">What does Hesham want? 🤔<br><span style="font-size:18px;font-weight:600">Tell your teacher first, then tap it!</span></div>
      <div class="choices">${sc.opts.map(o=>`<button class="choice" data-o="${o}">${o}</button>`).join('')}</div></div>
    <div id="rev"></div></div>`;
  const stv=document.getElementById('stv');
  if(stv){stv.onended=()=>document.getElementById('ask').classList.remove('hide');document.getElementById('play').onclick=()=>{stv.currentTime=0;stv.play()};}
  const stg=document.getElementById('stg')||document.createElementNS('http://www.w3.org/2000/svg','svg');
  const paintStill=()=>{stg.innerHTML=`<g>${sc.svg().replace(/class="a-[a-z0-9]+"/g,'')}</g><rect width="640" height="360" fill="#1B174055"/><circle cx="320" cy="180" r="56" fill="#FFD23F" stroke="#1B1740" stroke-width="6"/><path d="M304 150 L352 180 L304 210Z" fill="#1B1740"/>`};
  paintStill();
  const play=()=>{A();stg.innerHTML=sc.svg();sc.sfx.forEach(([t,f])=>setTimeout(()=>SFX[f](),t));setTimeout(()=>{document.getElementById('ask').classList.remove('hide')},3200);document.getElementById('play').textContent='↻ Watch again'};
  if(!stv){document.getElementById('play').onclick=play;stg.onclick=play;}
  document.querySelector('#ask .choices').onclick=e=>{const b=e.target.closest('.choice');if(!b)return;
    if(b.dataset.o!==sc.answer){b.classList.add('no');SFX.buzz();setTimeout(()=>b.classList.remove('no'),400);return}
    b.classList.add('yes');SFX.ding();confetti();
    const ask=ASKS.find(a=>a.id===sc.id);
    document.getElementById('rev').innerHTML=`<div class="reveal popin">
      <div class="say">🗣️ Hesham said:</div>
      <div class="ar">${ask.ar} ${sb(ask.ar)}</div>
      <p class="sub" style="margin:6px 0 10px">Say it like Hesham! Whiny voice on <span class="ar" style="font-size:22px">يَمّا</span> 😩</p>
      <div class="row" style="justify-content:center;gap:16px"><svg viewBox="-80 -110 160 250" style="width:90px;height:140px">${mom({mood:'angry'})}</svg>
      <div class="bubble mom popin" style="animation-delay:.6s"><div class="ar">${sc.momSays} ${sb(sc.momSays)}</div></div></div>
      <p class="bigq" style="font-size:20px">Uh oh… Yamma said no. How can Hesham win? 🤔 Keep playing to find out!</p>
      <div class="row" style="justify-content:center">${i<SCENES.length-1?`<button class="btn pink" onclick="gate('📺 Episode ${i+2}',()=>watch(${i+1}))">Next episode ▶</button>`:`<button class="btn lime" onclick="gateGo('shop')">Go to the Deal Shop 🛒</button>`}</div></div>`;
    star('watch',i>=SCENES.length-1?3:i>=2?2:1);
    setTimeout(()=>sayAll([ask.ar,sc.momSays],500),700);
  };
}

/* ---- 3. Memory ---- */
function memory(){
  const pool=[...ASKS].sort(()=>Math.random()-.5).slice(0,6);
  let cards=[];pool.forEach(p=>{cards.push({k:p.id,t:'e',v:p.e});cards.push({k:p.id,t:'a',v:p.ar.replace('يَمّا، ','')})});
  cards.sort(()=>Math.random()-.5);
  let open=[],done=0,moves=0,lock=false;
  scr().innerHTML=`${backBtn}<div class="panel"><div class="row" style="justify-content:space-between"><h2>🃏 Flip & Match</h2><div class="pill">Moves: <span id="mv">0</span></div></div>
    <p class="sub">Match the picture with the words. Read the words out loud when you flip them!</p>
    <div class="grid mem">${cards.map((c,i)=>`<button class="mc" data-i="${i}" aria-label="card">❓</button>`).join('')}</div>
    <div class="center" style="margin-top:14px"><button class="btn white" onclick="memory()">🔀 New game</button></div></div>`;
  document.querySelector('.mem').onclick=e=>{const b=e.target.closest('.mc');if(!b||lock||b.classList.contains('open')||b.classList.contains('done'))return;
    const c=cards[b.dataset.i];b.classList.add('open');b.innerHTML=c.t==='e'?`<span style="font-size:44px">${c.v}</span>`:`<span class="ar">${c.v}</span>`;SFX.pop();if(c.t==='a')say(c.v);open.push(b);
    if(open.length===2){moves++;document.getElementById('mv').textContent=moves;const [x,y]=open.map(o=>cards[o.dataset.i]);
      if(x.k===y.k&&x.t!==y.t){open.forEach(o=>{o.classList.remove('open');o.classList.add('done')});open=[];done++;SFX.ding();
        if(done===6){SFX.win();confetti();const st=moves<=10?3:moves<=15?2:1;star('memory',st);toast(`All pairs! ${'⭐'.repeat(st)}`)}}
      else{lock=true;setTimeout(()=>{open.forEach(o=>{o.classList.remove('open');o.textContent='❓'});open=[];lock=false},900)}}
  };
}

function combo(){
  const myAsks=[...S.wishes.map(w=>WISHES[w]).filter(Boolean).map(w=>['⭐'+w[0],'يَمّا، '+w[1]]),...S.custom.map(c=>['⭐','يَمّا، '+c.ar]),...ASKS.slice(0,4).map(a=>[a.e,a.ar])];
  const trays=[{t:'1 · ASK 🎯',items:myAsks},{t:'2 · GIVE 🤝',items:OFFERS},{t:'3 · CUTE FACE 🥺',items:PRESS},{t:'4 · CLOSE ✅',items:CLOSE}];
  const pick=[null,null,null,null];
  scr().innerHTML=`${backBtn}<div class="panel"><h2>🔥 Combo Builder</h2><p class="sub">Pick one card from each row to build your deal. Then press PLAY and say it!</p>${VIDEOS.combo?`<div style="margin-bottom:14px"><h3>🎬 Watch a real deal first!</h3>${vid('combo')}</div>`:''}
    <div class="slots" id="slots">${trays.map((t,k)=>`<div class="slot" data-k="${k}"><span class="t">${t.t}</span><span class="ar" style="opacity:.35">…</span></div>`).join('')}</div>
    <div class="tray">${trays.map((t,k)=>`<h3>${t.t}</h3><div class="chipset" data-k="${k}">${t.items.map((it,j)=>`<button class="chip" data-j="${j}"><span class="ar">${it[0]} ${it[1]}</span></button>`).join('')}</div>`).join('')}</div>
    <div class="center" style="margin-top:16px"><button class="btn pink" id="playc" style="font-size:22px">▶ PLAY THE DEAL</button></div>
    <div id="show" style="margin-top:14px"></div></div>`;
  document.querySelector('.tray').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const k=+b.parentElement.dataset.k,j=+b.dataset.j;pick[k]=trays[k].items[j];SFX.pop();say(pick[k][1]);
    [...b.parentElement.children].forEach(x=>x.classList.toggle('on',x===b));
    const sl=document.querySelector(`.slot[data-k="${k}"]`);sl.classList.add('f');sl.innerHTML=`<span class="t">${trays[k].t}</span><span class="ar popin">${pick[k][1]}</span>`};
  document.getElementById('playc').onclick=()=>{const miss=pick.findIndex(p=>!p);if(miss>=0){SFX.buzz();toast('Fill all 4 moves first!');return}
    const box=document.getElementById('show');box.innerHTML=`<div class="row" style="align-items:flex-start;gap:14px;justify-content:center">
      <svg viewBox="-120 -110 240 240" style="width:110px;height:110px">${kid({shirt:S.shirt,hair:S.hair,face:'open',eyes:'big'})}</svg>
      <div id="bb" style="display:flex;flex-direction:column;gap:8px;align-items:flex-start;flex:1;min-width:220px"></div>
      <svg viewBox="-80 -110 160 250" style="width:100px;height:155px" id="cm">${mom({mood:'angry'})}</svg></div><div id="mr" class="center"></div>`;
    (async()=>{for(const p of pick){SFX.pop();document.getElementById('bb').insertAdjacentHTML('beforeend',`<div class="bubble popin"><div class="ar" style="font-size:26px">${p[1]}</div></div>`);await Promise.all([say(p[1]),new Promise(r=>setTimeout(r,900))]);await new Promise(r=>setTimeout(r,300))}
      document.getElementById('cm').innerHTML=mom({mood:'happy'});document.getElementById('mr').innerHTML=`<div class="bubble mom popin" style="margin-top:12px"><div class="ar">خَلص، اتّفقنا! يَلّا روح 😄</div></div>`;SFX.win();confetti();star('combo',3);setTimeout(()=>say('خَلص، اتّفقنا! يَلّا روح'),600)})();
  };
}

/* ---- 5. Boss ---- */
const ROUNDS=[
 {m:'شو بدّك يا هشام؟',ic:'🤨',ok:'يَمّا، بَدّي أَلعَب إكس بوكس',bad:['حاضِر يَمّا','لأ!']},
 {m:'مِش هَسّا!',ic:'⏰',ok:'أنا بْرَتِّب غُرفتي',bad:['اتّفقنا!','بَدّي مَصاري']},
 {m:'أوّل إشي ادرُس!',ic:'📚',ok:'ماشي، أنا بَدرُس… بَس ساعة!',bad:['لأ!','بَدّي أَنام']},
 {m:'لأ! وخَلص!',ic:'😤',ok:'دَخيلِك يَمّا! إنتِ أحلى ماما بالدّنيا!',bad:['حاضِر يَمّا','بَدّي بيتزا']},
 {m:'ماشي… بَس نُصّ ساعة!',ic:'⏳',ok:'لأ، ساعة! عَشان خاطري! اتّفقنا؟',bad:['مِش هَسّا','بَدّي أَطلَع']},
];
function boss(){
  let r=0,hp=100,miss=0;
  scr().innerHTML=`${backBtn}<div class="panel"><h2>👑 Boss: Yamma</h2><p class="sub">Yamma attacks with words. Pick your move, then SAY it out loud to hit her!</p>
    <div class="boss"><div class="center"><div class="row" style="justify-content:space-between"><b>Yamma's patience</b><b id="hpn">100%</b></div><div class="meter hp"><i id="hp" style="width:100%"></i></div>
      <svg viewBox="-90 -120 180 260" style="width:100%;max-width:260px;height:auto;margin-top:8px" id="bm">${mom({mood:'angry'})}</svg></div>
      <div><div class="pill" style="display:inline-flex;margin-bottom:10px">Round <span id="rn">1</span> / 5</div><div id="atk"></div><div id="opts" style="margin-top:14px"></div></div></div></div>`;
  const draw=()=>{const R=ROUNDS[r];document.getElementById('rn').textContent=r+1;
    document.getElementById('atk').innerHTML=`<div class="bubble mom popin"><div class="ar">${R.ic} ${R.m}</div></div>`;
    const os=[R.ok,...R.bad].sort(()=>Math.random()-.5);
    document.getElementById('opts').innerHTML=os.map(o=>`<button class="opt" data-ok="${o===R.ok}" data-t="${o}"><span class="ar">${o}</span></button>`).join('');SFX.whoosh();setTimeout(()=>say(R.m),400)};
  draw();
  document.getElementById('opts').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const bm=document.getElementById('bm');
    if(b.dataset.ok!=='true'){miss++;b.classList.add('no');SFX.laugh();bm.innerHTML=mom({mood:'laugh'});bm.classList.remove('laugh');void bm.offsetWidth;bm.classList.add('laugh');setTimeout(()=>{bm.innerHTML=mom({mood:'angry'});b.classList.remove('no')},700);return}
    b.classList.add('yes');SFX.ding();say(b.dataset.t);hp-=20;bm.classList.remove('hit');void bm.offsetWidth;bm.classList.add('hit');
    document.getElementById('hp').style.width=hp+'%';document.getElementById('hpn').textContent=hp+'%';
    r++;if(r<ROUNDS.length){setTimeout(draw,2600)}else{setTimeout(()=>{bm.innerHTML=mom({mood:'happy'});document.getElementById('atk').innerHTML=`<div class="bubble mom popin"><div class="ar">🏆 خَلص، اتّفقنا! يَلّا روح</div></div>`;
      document.getElementById('opts').innerHTML=`<div class="reveal popin"><h2>YOU BEAT THE BOSS! 🎉</h2>${VIDEOS.win?vid('win','autoplay'):''}<p class="sub">Now say it: <span class="ar" style="font-size:26px">اتَّفَقنا! حاضِر يَمّا</span></p><button class="btn pink" onclick="boss()">Play again ↻</button></div>`;
      SFX.win();confetti();say('خَلص، اتّفقنا! يَلّا روح');star('boss',miss===0?3:miss<=3?2:1)},2600)}
  };
}

 'لأ! · لأ! · مِش · هَسّا!','أوّل · إشي · ادرُس · يَلّا!','دَخيلِك · يَمّا · بْحِبِّك · يَمّا!','ماشي… · بَس · ساعة · وحدة!',
 'اتَّفَقنا! · اتَّفَقنا! · حاضِر يَمّا · وَعد!'].map(l=>l.split(' · '));
const BEATS=[0.093, 0.65, 1.207, 1.765, 2.322, 2.856, 3.413, 3.971, 4.505, 5.062, 5.526, 5.991, 6.525, 7.082, 7.639, 8.197, 8.731, 9.195, 9.66, 10.24, 10.774, 11.331, 11.889, 12.446, 12.98, 13.537, 14.095, 14.814, 15.372, 15.929, 16.463, 17.043, 17.763, 18.321, 18.855, 19.412, 19.969, 20.526, 21.107, 21.804, 22.361, 22.918, 23.499, 24.079, 24.683, 25.31, 25.89, 26.424, 26.958, 27.516, 28.073, 28.63, 29.187, 29.745, 30.279, 30.836, 31.393, 31.951, 32.485, 33.042, 33.599, 34.133, 34.691, 35.248, 35.805, 36.362, 36.92, 37.454, 38.011, 38.568, 39.126, 39.683, 40.217, 40.705, 41.169, 41.703, 42.237, 42.794, 43.352, 43.909, 44.466, 45.023, 45.558, 46.045, 46.556, 47.044, 47.601, 48.135, 48.692, 49.25, 49.969, 50.527, 51.084, 51.641, 52.198, 52.849, 53.476, 54.033, 54.567, 55.124, 55.681, 56.216, 56.773, 57.377, 57.98, 58.584, 59.188, 59.722, 60.302, 60.86, 61.486, 62.113, 62.671, 63.228, 63.785, 64.505, 65.062, 65.62, 66.177, 66.734, 67.384, 68.011, 68.545, 69.103, 69.66, 70.24, 70.798, 71.332, 71.866, 72.446, 72.98, 73.538, 74.095, 74.652, 75.186, 75.743, 76.301, 76.835, 77.392, 77.949, 78.507, 79.064, 79.784, 80.341, 80.898, 81.432];
let rapRAF=null,beatA=null,songA=null;
function stopRap(){if(rapRAF){cancelAnimationFrame(rapRAF);rapRAF=null}try{beatA&&beatA.pause();songA&&songA.pause()}catch(e){}}
function beatIndex(t){if(t<BEATS[0])return -1;let lo=0,hi=BEATS.length-1;if(t>=BEATS[hi]){const ibi=(BEATS[hi]-BEATS[0])/(BEATS.length-1);return hi+Math.floor((t-BEATS[hi])/ibi)}while(lo<hi){const m=(lo+hi+1)>>1;if(BEATS[m]<=t)lo=m;else hi=m-1}return lo}
function rap(){
  stopRap();
  const MODES={slow:{rate:.85,per:2,label:'🐢 Slow'},medium:{rate:1,per:2,label:'🚶 Medium'},fast:{rate:1,per:1,label:'🚀 Fast'}};
  let mode='slow';
  scr().innerHTML=`${backBtn}<div class="panel"><h2>🎤 Yamma Rap</h2><p class="sub">First listen to the song. Then pick a speed, start the beat and rap it! The yellow box shows the word to say.</p>
    <div class="dealbox" style="margin-bottom:14px"><div class="row" style="justify-content:center"><button class="btn grape" id="song">🎧 Listen to the song</button><button class="btn white hide" id="songst">⏹ Stop song</button></div>
      <div id="sheet" class="hide" style="margin-top:10px">${LYRICS.map(l=>`<div class="ar" style="font-size:22px">${l.join(' ')}</div>`).join('')}</div></div>
    <div class="row" style="margin-bottom:12px" id="modes">${Object.entries(MODES).map(([k,m])=>`<button class="btn ${k===mode?'lime':'white'}" data-m="${k}">${m.label}</button>`).join('')}
    <button class="btn pink" id="rgo">▶ Start beat</button><button class="btn white" id="rst">⏹ Stop</button></div>
    <div class="karaoke"><div class="beatdots" id="dots"><i></i><i></i><i></i><i></i></div><div class="line" id="ln"></div><div class="next" id="nx"></div></div>
    <p class="sub center" style="margin-top:12px">Yamma's lines: do a funny <b>Yamma voice</b> 👩!</p></div>`;
  beatA=new Audio('beat.mp3');beatA.loop=true;beatA.preload='auto';
  songA=new Audio('song.mp3');songA.preload='auto';
  const ln=document.getElementById('ln'),nx=document.getElementById('nx'),dots=[...document.querySelectorAll('#dots i')];
  const paint=(li,wi)=>{ln.innerHTML=LYRICS[li].map((w,k)=>`<span class="${k===wi?'now':''}">${w}</span>`).join(' ');nx.textContent=LYRICS[(li+1)%LYRICS.length].join(' ');dots.forEach((d,k)=>d.classList.toggle('on',k===wi))};
  paint(0,-1);
  const tick=()=>{const m=MODES[mode];const k=beatIndex(beatA.currentTime);const count=4*m.per;
    if(k<count){const c=Math.floor(Math.max(k,0)/m.per);ln.innerHTML=`<span>${['٤','٣','٢','١'][Math.min(c,3)]}</span>`;dots.forEach((d,i)=>d.classList.toggle('on',i<=c));nx.textContent=LYRICS[0].join(' ')}
    else{const w=Math.floor((k-count)/m.per);paint(Math.floor(w/4)%LYRICS.length,w%4)}
    rapRAF=requestAnimationFrame(tick)};
  const startBeat=()=>{stopRap();beatA.currentTime=0;beatA.playbackRate=MODES[mode].rate;try{beatA.preservesPitch=true}catch(e){}beatA.play().catch(()=>toast('Tap Start again to play the beat'));tick();star('rap',2)};
  document.getElementById('modes').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;SFX.pop();[...e.currentTarget.querySelectorAll('[data-m]')].forEach(x=>{x.classList.toggle('lime',x===b);x.classList.toggle('white',x!==b)});if(rapRAF)startBeat()};
  document.getElementById('rgo').onclick=startBeat;
  document.getElementById('rst').onclick=()=>{stopRap();paint(0,-1);star('rap',3)};
  const sb=document.getElementById('song'),ss=document.getElementById('songst'),sheet=document.getElementById('sheet');
  sb.onclick=()=>{stopRap();songA.currentTime=0;songA.play().catch(()=>{});sb.classList.add('hide');ss.classList.remove('hide');sheet.classList.remove('hide')};
  ss.onclick=()=>{songA.pause();ss.classList.add('hide');sb.classList.remove('hide')};
  songA.onended=()=>{ss.classList.add('hide');sb.classList.remove('hide')};
}

/* ---- 7. Wish machine ---- */
function wish(){
  scr().innerHTML=`${backBtn}<div class="panel"><h2>⭐ Wish Machine</h2><p class="sub">What else do you want in life? Tap anything! Your wishes go into the Combo Builder.</p>
    <div class="dealbox" id="deal"><span class="sub">Tap a wish to build your deal 👇</span></div>
    <div class="grid wishes" style="margin-top:14px">${WISHES.map((w,k)=>`<button class="wish${S.wishes.includes(k)?' on':''}" data-k="${k}"><span class="e">${w[0]}</span><span class="ar">${w[1]}</span></button>`).join('')}</div>
    <div class="panel" style="margin-top:18px;background:#fff;box-shadow:none"><h3>✍️ Not here? Make your own wish!</h3>
      <p class="sub" style="margin:0 0 8px">Tell your teacher what you want. Your teacher types the Arabic.</p>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))"><div><label for="cw" class="sub">Your wish (any language)</label><input id="cw" type="text" placeholder="e.g. a new football"></div>
      <div><label for="ca" class="sub">Arabic (teacher)</label><input id="ca" class="arin" type="text" placeholder="بَدّي …"></div></div>
      <button class="btn lime" id="addc" style="margin-top:10px">➕ Add my wish</button>
      <div class="chipset" id="mine" style="margin-top:12px"></div></div></div>`;
  const offer=()=>OFFERS[Math.random()*OFFERS.length|0][1], pr=()=>PRESS[Math.random()*PRESS.length|0][1];
  const build=(e,a)=>{const o=offer(),p=pr();document.getElementById('deal').innerHTML=`<div style="font-size:44px">${e}</div><div class="ar popin">يَمّا، ${a}<br>${o}<br>${p} اتَّفَقنا؟</div><div class="row" style="justify-content:center;margin-top:8px"><button class="btn sky" id="hear">🔊 Hear the deal</button><button class="btn white" id="shuf">🔀 Another deal</button></div>`;document.getElementById('hear').onclick=()=>sayAll([a,o,p,'اتَّفَقنا؟']);document.getElementById('shuf').onclick=()=>{SFX.pop();build(e,a)}};
  const mine=()=>{document.getElementById('mine').innerHTML=S.custom.map((c,i)=>`<span class="chip on"><span class="ar">⭐ ${c.ar}</span> <button class="btn white" style="padding:0 8px;font-size:14px;box-shadow:none" data-x="${i}" aria-label="remove">✕</button></span>`).join('')};mine();
  document.querySelector('.wishes').onclick=e=>{const b=e.target.closest('.wish');if(!b)return;const k=+b.dataset.k;
    if(!S.wishes.includes(k)){S.wishes.push(k);b.classList.add('on');SFX.coin()}else{SFX.pop()}
    save();star('wish',Math.min(3,Math.ceil(S.wishes.length/2)));build(WISHES[k][0],WISHES[k][1]);say(WISHES[k][1])};
  document.getElementById('addc').onclick=()=>{const ar=document.getElementById('ca').value.trim();const en=document.getElementById('cw').value.trim();if(!ar){SFX.buzz();toast('Teacher: type the Arabic first');return}
    S.custom.push({ar,en});save();SFX.win();confetti();mine();build('⭐',ar);document.getElementById('ca').value='';document.getElementById('cw').value='';star('wish',3)};
  document.getElementById('mine').onclick=e=>{const x=e.target.closest('[data-x]');if(!x)return;S.custom.splice(+x.dataset.x,1);save();mine()};
}

function mission(){
  scr().innerHTML=`${backBtn}<div class="panel"><h2>📱 The Real Mission</h2><p class="sub">This one is for real. Win a real deal with your real Yamma tonight!</p>
    <div class="grid steps">

  const w=S.custom.length?S.custom[S.custom.length-1].ar:S.wishes.length?WISHES[S.wishes[S.wishes.length-1]][1]:ASKS[0].ar.replace('يَمّا، ','');
  document.getElementById('md').innerHTML=`يَمّا، ${w}<br>${OFFERS[0][1]}<br>عَشان خاطري! اتَّفَقنا؟`;
  document.getElementById('done').onclick=()=>{SFX.win();confetti();star('mission',3);toast('LEGEND! 🏆')};
}

try{paintTop();(S.name&&S.name!=='Hesham'||totalStars())?map():start();}catch(e){__showErr('INIT: '+e.message)}
