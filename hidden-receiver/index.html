:root{
  color-scheme:light;
  --ink:#1d1d29; --paper:#f3faff; --surface:#ffffff; --green:#38b191; --green-ink:#14805f;
  --tint:#e3f7ef; --line:#d9e8ef; --muted:#56656b; --leb:#d62839; --leb-tint:#ffeef0;
  --amber:#b86e00; --amber-tint:#fff4d6; --sun:#ffc93c; --sea:#1c7ed6; --sea-tint:#e7f3ff; --coral:#ff6b57;
  --bad:#d6336c; --bad-tint:#ffeef4; --shadow:0 1px 2px rgba(28,126,214,.08),0 10px 28px rgba(28,126,214,.10);
  --ar:"Noto Naskh Arabic","Amiri","Scheherazade New","Traditional Arabic",serif;
  --ui:"Manrope","Noto Naskh Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
  --story:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.ar{font-family:var(--ar)!important;direction:rtl;unicode-bidi:isolate;line-height:1.9;font-weight:500}
.tr{display:block;font-size:.86rem;color:var(--muted);font-style:italic;letter-spacing:.01em}
.tr.inline{display:inline}
body.no-tr .tr{display:none!important}
.en{font-size:.95rem}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.01em;font-size:1.02rem;display:flex;align-items:baseline;gap:8px;margin-inline-end:auto}
.brand .ar{font-size:1.05rem;color:var(--green-ink);line-height:1}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--green-ink)}
.tools{display:flex;gap:6px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:.82rem;font-weight:700}
.tbtn[aria-pressed="false"]{opacity:.55}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--green);width:0;transition:width .5s}
/* stage */
.stage{margin-top:22px}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green-ink)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);letter-spacing:-.02em;line-height:1.15}
h2{font-size:clamp(1.3rem,3.2vw,1.7rem);letter-spacing:-.01em;line-height:1.2}
h3{font-size:1.05rem}
.lead{color:var(--muted);max-width:62ch;margin:8px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:800;background:var(--green);color:#fff;letter-spacing:.01em;transition:transform .12s,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 14px;font-size:.88rem}
.btn.leb{background:var(--leb)}
.foot-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
/* map */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:18px}
.node{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-height:118px;position:relative}
.node .n{font-size:.72rem;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.node .t{font-weight:800;line-height:1.25}
.node .ar{font-size:1.15rem;color:var(--green-ink);line-height:1.5}
.node .m{font-size:.75rem;color:var(--muted);margin-top:auto}
.node.done{background:var(--tint);border-color:transparent}
.node.done .n::after{content:" · done";color:var(--green-ink)}
.node.cur{outline:2px solid var(--green);outline-offset:-2px}
.node.lock{opacity:.5;cursor:not-allowed}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.stat .k{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.stat .v{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
/* intro / joke */
.joke{margin-top:18px;border-left:3px solid var(--green);padding:6px 0 6px 16px;font-family:var(--story);font-size:1.2rem;line-height:1.45}
.joke .p2{opacity:0;transform:translateY(4px);transition:opacity .6s,transform .6s;display:block;margin-top:6px;font-style:italic;color:var(--green-ink)}
.joke .p2.on{opacity:1;transform:none}
.joke .who{display:block;font-family:var(--ui);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:4px}
/* learn cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;text-align:start;display:flex;flex-direction:column;gap:8px;position:relative}
.card.closed{cursor:pointer}
.card.closed:hover{border-color:var(--green)}
.card .big{font-size:2rem;line-height:1.7}
.card .hint{font-size:.78rem;color:var(--muted);font-weight:700}
.card.open{border-color:var(--green)}
.card .tick{position:absolute;top:10px;inset-inline-end:12px;font-size:.72rem;font-weight:800;color:var(--green-ink)}
.icon{width:40px;height:40px;border-radius:12px;background:var(--tint);display:grid;place-items:center;color:var(--green-ink);flex:none}
.icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.say{font-size:.85rem;font-weight:800;color:var(--green-ink);background:var(--tint);padding:6px 10px;border-radius:10px;align-self:flex-start}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.twin>div{border-radius:12px;padding:8px 10px}
.twin .l{background:var(--leb-tint)}
.twin .f{background:var(--tint)}
.twin .lab{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.twin .l .lab{color:var(--leb)}
.twin .f .lab{color:var(--green-ink)}
.twin .ar{font-size:1.4rem}
.same{font-size:.78rem;font-weight:800;color:var(--green-ink)}
.play{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:800;display:inline-flex;gap:6px;align-items:center}
.play::before{content:"";width:0;height:0;border-left:8px solid var(--green);border-top:5px solid transparent;border-bottom:5px solid transparent}
/* segments */
.segs{display:inline-flex;gap:2px;align-items:baseline;direction:rtl;unicode-bidi:isolate;flex-wrap:wrap;justify-content:center}
.seg{font-family:var(--ar);font-size:inherit;border-radius:8px;padding:0 4px;line-height:1.8}
.seg.v{color:var(--ink)}
.seg.d{color:var(--amber);background:var(--amber-tint)}
.seg.r,.seg.r2{color:var(--green-ink);background:var(--tint)}
.seg.r2{box-shadow:inset 0 -2px 0 var(--green)}
.seg.f{color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;font-weight:700;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.legend .lv::before{background:var(--ink)}
.legend .ld::before{background:var(--amber)}
.legend .lr::before{background:var(--green)}
.tapseg{border:1px solid var(--line);background:var(--surface);font-size:2.4rem;padding:2px 10px;border-radius:12px}
.tapseg:hover{border-color:var(--green)}
/* lines */
.line{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:6px;max-width:92%}
.line.z{align-self:flex-start;border-inline-start:4px solid var(--green)}
.line.b{align-self:flex-end;border-inline-end:4px solid var(--ink)}
.line .who{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.line .ar{font-size:1.55rem;text-align:right}

const shuffle = (a, seed) => { a = a.slice(); let r = seed || Math.random; for(let i=a.length-1;i>0;i--){ const j = Math.floor((typeof r==="function"? r(): Math.random())*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function seeded(n){ let x = n*9301+49297; return () => { x = (x*9301+49297)%233280; return x/233280; }; }

/* ---------- sound ---------- */
let actx = null;
function tone(freqs, dur=.12, type="sine", gap=.09, vol=.07){
  if(!S.sfx) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    freqs.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f;
      const s=t0+i*gap; g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(vol,s+.015); g.gain.exponentialRampToValueAtTime(.0001,s+dur);
      o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s+dur+.03); });
  }catch(e){}
}
const SFX = {ok:()=>tone([659,988],.16), no:()=>tone([233,196],.2,"triangle",.1,.06), tap:()=>tone([540],.05,"sine",0,.03),
  win:()=>tone([523,659,784,1047],.22,"sine",.11), unlock:()=>tone([392,523,659,784],.16,"sine",.08)};
let curAudio = null, chainTok = 0;
function stopAudio(){ chainTok++; try{ if(curAudio){ curAudio.pause(); curAudio=null; } if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} }
function speakText(txt, done){
  if(!S.voice || !("speechSynthesis" in window)){ if(done) setTimeout(done,50); return; }
  try{ const u = new SpeechSynthesisUtterance(txt.replace(/[…·]/g,"، ")); u.lang="ar-SA"; u.rate=S.rate;
    const v = speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang)); if(v) u.voice=v;
    if(done){ u.onend=done; u.onerror=done; } speechSynthesis.speak(u); }catch(e){ if(done) done(); }
}
function playOne(it, done){
  if(it.n && AUDIO_READY.includes(it.n)){ const a = new Audio(pad(it.n)+".mp3"); curAudio = a; a.onended = done; a.play().catch(()=>{ if(!it.noTTS) speakText(it.txt, done); else done(); }); return; }
  if(it.noTTS){ toast("Mohamed recites this one. His recording will play here once it is added."); done(); return; }
  speakText(it.txt, done);
}
function playItems(items){
  stopAudio(); const tok = chainTok; let i = 0;

}

/* ---------- ui helpers ---------- */
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
const NONJOIN = "ءآأؤإاةدذرزوى";
const baseLast = s => { const b = s.replace(/[ً-ْٰـ‍]/g,""); return b[b.length-1]; };
function rc(t){ const b = t.replace(/[\u064B-\u0652\u200D]/g,""); if(b==="هم") return "rc-them"; if(b==="ها") return "rc-her"; if(b==="ني") return "rc-me"; if(b==="نا") return "rc-us"; if(b==="ك") return t.includes("\u0650") ? "rc-youf" : "rc-youm"; return "rc-him"; }
function segCls(sg){ return sg[1] + ((sg[1]==="r"||sg[1]==="r2") ? " "+rc(sg[0]) : ""); }
function segHTML(segs, o={}){
  if(!o.tap) return `<span class="ar segw" lang="ar">` + segs.map(sg=>`<span class="seg-i ${o.plain?"":segCls(sg)}">${sg[0]}</span>`).join("") + `</span>`;
  return `<span class="segs">` + segs.map((sg,i)=>{
    let t = sg[0]; const prev = segs[i-1], next = segs[i+1];
    if(next && !/\s$/.test(t) && !NONJOIN.includes(baseLast(t))) t = t + "‍";
    if(prev && !/\s$/.test(prev[0]) && !NONJOIN.includes(baseLast(prev[0]))) t = "‍" + t;
    const cls = o.plain ? "" : sg[1];
    return o.tap ? `<button class="tapseg seg ${cls}" data-i="${i}" lang="ar">${t}</button>` : `<span class="seg ${cls}" lang="ar">${t}</span>`;
  }).join("") + `</span>`;
}
function arOf(e, o={}){ return (e.segs && !o.flat) ? segHTML(e.segs, o) : `<span class="ar" lang="ar">${e.ar}</span>`; }

function figure(x, cls, name){ return `<g><circle cx="${x}" cy="182" r="26" class="${cls}"/><path d="M${x-44} 300c4-58 22-86 44-86s40 28 44 86z" class="${cls}"/><text x="${x}" y="330" text-anchor="middle" class="sa-txt">${name}</text></g>`; }
function sceneArt(act){

  if(act!==2){ bg += `<circle cx="720" cy="${act===1?120:70}" r="34" class="sa-sun"/>`; }

/* ---------- top bar ---------- */
function mastered(){ return Object.values(S.mastery).filter(v=>v>=2).length; }
function updateBar(){
  $("#xp").textContent = S.xp; $("#streak").textContent = S.streak; $("#mast").textContent = mastered();
  
  let prog = S.done.length/LEVELS.length;
  if(view.li!=null && view.mode==="screen"){ prog = (view.li + (view.si/LEVELS[view.li].screens.length))/LEVELS.length; }
  $("#prog").style.width = Math.round(prog*100)+"%";
}
function clearTimer(){ if(TIMER){ clearInterval(TIMER); TIMER=null; } }
function go(v){ clearTimer(); stopAudio(); view = v; render(); window.scrollTo(0,0); }

/* ---------- XP ---------- */
function reward(id, firstTry, bonus=0){
  if(firstTry){ S.streak++; S.best=Math.max(S.best,S.streak); S.xp += 10 + Math.min(S.streak,5) + bonus; if(id){ S.mastery[id]=(S.mastery[id]||0)+1; } }
  else { S.streak = 0; S.xp += 4; }
  save(); updateBar();
}

/* ---------- views ---------- */
function render(){
  const app = $("#app"); AUTO = null; updateBar();
  const m = view.mode;
  if(m==="map") return renderMap(app);
  if(m==="stop") return renderStop(app);
  if(m==="intro") return renderIntro(app);
  if(m==="screen") return renderScreen(app);
  if(m==="done") return renderDone(app);
  if(m==="cert") return renderCert(app);
}
function levelOpen(i){ return i===0 || S.done.includes(LEVELS[i-1].n) || S.done.includes(LEVELS[i].n); }
function startLevel(i){ const L = LEVELS[i]; if(L.stop && !S.unlocked.includes(L.n)) go({mode:"stop", li:i}); else go({mode:"intro", li:i}); }

}

function renderStop(app){
  const L = LEVELS[view.li]; const code = L.stop;
  code.forEach(id=>use(id,"stop code"));
  const pool = LEVELS.slice(0,view.li).flatMap(l=>l.screens.flatMap(s=>s.ids||[])).filter(id=>LEX[id] && LEX[id].kind==="word" && !code.includes(id));
  const extra = shuffle(Array.from(new Set(pool)), seeded(L.n)).slice(0,3);
  const tiles = shuffle(code.concat(extra), seeded(L.n+7));
  let picked = [];
  app.innerHTML = `<section class="stop fadein"><div class="eyebrow" style="color:var(--green)">Teacher checkpoint</div><h1>STOP!</h1>
   <p><b>Mohamed will explain this before the next step.</b></p><p>When he is ready, he will say three words in Arabic. Tap them in the order you hear them.</p>
   <div class="tiles">${tiles.map(id=>`<button class="tile" data-id="${id}"><span class="ord"></span><span class="ar" style="display:block">${LEX[id].ar}</span>${trOf(LEX[id].tr)}</button>`).join("")}</div></section>`;
  app.querySelectorAll(".tile").forEach(b=>b.addEventListener("click",()=>{
    if(b.classList.contains("sel")) return;
    picked.push(b.dataset.id); b.classList.add("sel"); b.querySelector(".ord").textContent = picked.length; SFX.tap();
    const ok = picked.every((id,i)=>id===code[i]);
    if(!ok){ SFX.no(); const s=app.querySelector(".stop"); s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake"); setTimeout(()=>{ picked=[]; app.querySelectorAll(".tile").forEach(t=>{t.classList.remove("sel"); t.querySelector(".ord").textContent="";}); }, 450); return; }
    if(picked.length===code.length){ SFX.unlock(); S.unlocked.push(L.n); save(); setTimeout(()=>go({mode:"intro", li:view.li}), 500); }
  }));
  AUTO = () => code.forEach(id=>app.querySelector(`.tile[data-id="${id}"]`).click());
}

   <h1 style="margin-top:6px">${L.title}</h1><p class="lead">${L.skill}</p>
   <div class="joke"><span class="who">Mohamed's one-liner</span>${L.joke[0]}<span class="p2" id="p2">${L.joke[1]}</span></div>

  } else if(it.k==="pick"){

      if(R.teachAfter) teach(R.teachAfter);
      $("#fb").innerHTML = `<div class="fb ${ok?"ok":"no"}">${ok?(tries===1?"Excellent. ":"Got it. "):"Here it is: "}${R.fb}</div>`;
      if(R.afterPlay) setTimeout(()=> it.k==="leb" ? playBoth(R.afterPlay) : play(R.afterPlay), 200);
      app.querySelectorAll(".opt,.tapseg,.chip,.vw,.kbd button").forEach(b=>b.disabled=true);
      nx.hidden = false; nx.focus();
    };
    const wrong = (el) => { SFX.no(); if(el) el.classList.add("no"); if(S.diff==="gentle") $("#hint").textContent = R.hint; if(tries>=maxTries) finish(false); };
    if(tlimit){ let left = tlimit*10; TIMER = setInterval(()=>{ left--; const b=$("#tbar"); if(b) b.style.width = (left/(tlimit*10)*100)+"%"; if(left<=0){ clearTimer(); tries=maxTries; finish(false); } },100); }
    // wire
    if(R.opts){ app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{ tries++; const k=+b.dataset.k; if(k===R.ans){ b.classList.add("ok"); finish(true); } else { b.disabled=true; wrong(b); if(finished) app.querySelectorAll(".opt")[R.ans].classList.add("ok"); } })); }
    if(R.tap){ app.querySelectorAll(".tapseg").forEach(b=>b.addEventListener("click",()=>{ tries++; const k=+b.dataset.i; const e=LEX[it.id]; if(k===R.target){ app.querySelectorAll(".tapseg").forEach((x,j)=>x.className += " "+segCls(e.segs[j])); finish(true); } else { b.style.opacity=.4; wrong(null); if(finished) app.querySelectorAll(".tapseg").forEach((x,j)=>x.className += " "+segCls(e.segs[j])); } })); }
    if(R.verse){ app.querySelectorAll(".vw").forEach(b=>b.addEventListener("click",()=>{ tries++; const k=+b.dataset.k; if(R.targets.includes(k)){ R.targets.forEach(t=>app.querySelector(`.vw[data-k="${t}"]`).classList.add("hl")); finish(true); } else { b.style.opacity=.4; wrong(null); if(finished) R.targets.forEach(t=>app.querySelector(`.vw[data-k="${t}"]`).classList.add("hl")); } })); }
    if(R.build){ let seq=[]; const tray=$("#tray");
      const draw = () => { tray.innerHTML = seq.map((k,j)=>`<button class="chip ${segCls(R.chips[k])}" data-j="${j}"><span class="ar">${R.chips[k][0]}</span></button>`).join(""); tray.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{ const k=seq[+b.dataset.j]; seq.splice(+b.dataset.j,1); app.querySelector(`#pool [data-k="${k}"]`).classList.remove("used"); draw(); }); };
      app.querySelectorAll("#pool .chip").forEach(b=>b.addEventListener("click",()=>{ if(b.classList.contains("used")) return; seq.push(+b.dataset.k); b.classList.add("used"); SFX.tap(); draw(); }));
      $("#clr").onclick = ()=>{ seq=[]; app.querySelectorAll("#pool .chip").forEach(b=>b.classList.remove("used")); draw(); };
      $("#chk").onclick = ()=>{ if(!seq.length) return; tries++; const ok = seq.length===R.bans.length && seq.every((k,j)=>k===R.bans[j]);
        if(ok){ tray.innerHTML = `<div style="font-size:2rem">${arOf(LEX[it.id])}</div>`; finish(true); } else { tray.classList.add("shake"); setTimeout(()=>tray.classList.remove("shake"),400); wrong(null); if(finished) tray.innerHTML = `<div style="font-size:2rem">${arOf(LEX[it.id])}</div>`; } };
      R.autoFn = () => { R.bans.forEach(k=>app.querySelector(`#pool [data-k="${k}"]`).click()); $("#chk").click(); };
    }
    if(R.type){ let txt=""; const out=$("#typed");
      app.querySelectorAll(".kbd button").forEach(b=>b.addEventListener("click",()=>{ const ch=b.dataset.ch; if(ch==="⌫") txt=txt.slice(0,-1); else txt+=ch; out.textContent=txt; SFX.tap(); }));
      $("#chk").onclick = ()=>{ if(!txt.trim()) return; tries++; if(norm(txt)===norm(R.answer)){ finish(true); } else { out.classList.add("shake"); setTimeout(()=>out.classList.remove("shake"),400); wrong(null); if(!finished) $("#hint").textContent = R.hint; } };
      R.autoFn = () => { txt = norm(R.answer); out.textContent = txt; $("#chk").click(); };
    }
    AUTO = () => {
      if(finished){ nx.click(); return; }
      if(R.opts) app.querySelectorAll(".opt")[R.ans].click();
      else if(R.tap) app.querySelectorAll(".tapseg")[R.target].click();
      else if(R.verse) app.querySelector(`.vw[data-k="${R.targets[0]}"]`).click();
      else if(R.autoFn) R.autoFn();
    };
  };
  show();
}
function scQuiz(app, sc, L){
  const hdr = head(sc,L);
  const items = S.diff==="gentle" ? sc.items : sc.items;
  runQuiz(app, items, {headHTML: hdr, onDone:(sc2,tot)=>{
    app.innerHTML = `<section class="panel fadein"><div class="eyebrow">Round complete</div><h2 style="margin-top:6px">${sc2} / ${tot} correct</h2><p class="lead">${sc2===tot?"Clean sweep.":"Anything you missed comes back later in the boss round."}</p><div class="foot-actions"><button class="btn" id="cont">Continue</button></div></section>`;
    $("#cont").onclick = nextScreen; AUTO = nextScreen; }});
}
function scBoss(app, sc, L){
  const pool = LEVELS.filter(l=>!l.boss).flatMap(l=>l.screens.filter(s=>s.t==="quiz").flatMap(s=>s.items)).filter(it=>["recv","tap","leb","gender","bin","pick","verse","build"].includes(it.k));
  const items = shuffle(pool).slice(0,12);
  const hdr = `<div class="eyebrow">Boss</div><h2 style="margin-top:4px">Who did what to whom?</h2><p class="lead">Twelve mixed questions from the whole class${S.diff==="gentle"?"":", against the clock"}. Every level comes back.</p>`;
  runQuiz(app, items, {headHTML: hdr, boss:true, onDone:(s2,tot)=>{
    app.innerHTML = `<section class="panel fadein"><div class="eyebrow">Boss defeated</div><h2 style="margin-top:6px">${s2} / ${tot}</h2><p class="lead">${s2>=10?"Outstanding. The receivers are yours.":"Solid. Replay the boss any time from the map to push that score up."}</p><div class="foot-actions"><button class="btn" id="cont">See your certificate</button></div></section>`;
    $("#cont").onclick = nextScreen; AUTO = nextScreen; }});
}
/* ---------- Certificate ---------- */
function renderCert(app){
  const say = ["saadtuhu","shakarani","yahfazuna","qaratuha","antaziruka","uallimuki","saadahum","ataytukihi","sc1"];
  const d = new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  teach("dua");
  app.innerHTML = `<section class="stack fadein"><div class="cert"><div class="eyebrow">Arabanion · Certificate of completion</div><h1 style="margin-top:8px">Zainab</h1>
   <p class="lead" style="margin-inline:auto">completed <b>Class 19 · The Hidden Receiver</b> (attached pronouns with verbs) on ${d}.</p>
   <div class="statgrid"><div class="stat"><div class="k">XP</div><div class="v">${S.xp}</div></div><div class="stat"><div class="k">Best streak</div><div class="v">${S.best}</div></div><div class="stat"><div class="k">Mastered words</div><div class="v">${mastered()}</div></div></div>
   <h3 style="margin-top:18px">Zainab can now say</h3><ul>${say.map(id=>{ const e=LEX[id]; return `<li><span class="ar">${e.ar}</span> ${trOf(e.tr,1)} · ${e.en}</li>`; }).join("")}</ul>
   <div class="note" style="margin-top:16px"><div class="ar" style="font-size:1.6rem">${LEX.dua.ar}</div>${trOf(LEX.dua.tr)}<div>${LEX.dua.en}</div><div style="margin-top:6px">${playBtn("dua","Listen")}</div></div></div>
   <div class="mission"><div class="eyebrow">Real-life mission · before Class 20</div><p style="margin:6px 0 0">Send Mohamed a voice note of three Fuṣḥā sentences about someone who helped you this week:</p>
    <ol style="margin:8px 0 0;padding-inline-start:20px"><li>Who helped you: <span class="ar">سَاعَدَنِي …</span></li><li>What you did: <span class="ar">شَكَرْتُهُ</span> or <span class="ar">شَكَرْتُهَا</span></li><li>One sentence to them with ـكَ or ـكِ, for example <span class="ar">سَأَنْتَظِرُكِ</span></li></ol></div>
   <div class="mission" style="background:var(--amber-tint)"><div class="eyebrow" style="color:var(--amber)">Homework from the class file</div><ol style="margin:8px 0 0;padding-inline-start:20px"><li><b>The Storyteller:</b> write three short sentences where an action is done TO someone or something (example: I read the book, <span class="ar">قَرَأْتُهُ</span>).</li><li><b>Tafsīr speaker:</b> a one-minute voice note on the difference between <span class="ar">خَلَقْتَنِي</span> and <span class="ar">خَلَقْتَهُ</span>, using the story of Iblīs and Ādam.</li></ol></div>
   <div class="foot-actions"><button class="btn ghost" id="map">Back to map</button></div></section>`;
  bindPlays(app); $("#map").onclick = ()=>go({mode:"map"});
  AUTO = null;
}

/* ---------- modals ---------- */
function modal(html, onBind){ const m=document.createElement("div"); m.className="modal"; m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}<div class="foot-actions"><button class="btn ghost" data-close>Close</button></div></div>`;
  document.body.appendChild(m); m.addEventListener("click",ev=>{ if(ev.target===m || ev.target.hasAttribute("data-close")) m.remove(); }); if(onBind) onBind(m); return m; }
function openPhrasebook(){
  const groups = [["Me & us",["shakarani","raani","yahfazuna","yarifuni","khalaqana","m_ni","m_na"]],["Him / it",["saadtuhu","raaytuhu","akhadhtuhu","lamafhamhu","saadtihi","bihi","tudayyiihi","uriduhu","wajadtuhu","samituhu","m_hu"]],["Her / it",["saadtuha","qaratuha","kutub","wajadnaha","m_ha"]],["You",["antaziruka","antaziruki","uallimuki","uallimuka","uhibbuki","uhibbuka","ansaki","ansaka","yaraka","m_ka","m_ki"]],["Them",["saadahum","m_hum"]],["Two receivers",["ataytukihi"]],["Roots & raw verbs",["root_shkr","root_alm","raw_samitu","raw_yara","raw_wajadna","raw_hada"]],["Things",["n_qalam","n_haqiba","n_kitab","n_kutub","n_dars","n_maktaba","n_ukht","n_tifl"]],["Phrases",["sc1","sc2","hadana"]],["The story",["Z1","B1","Z2","B2","Z3","B3","Z4","B4","Z5","B5","Z6","B6","Z7","B7","Z8","B8"]],["Qur'an & duʿāʾ",["q1","q2","q3","q4","dua"]]];
  let any = false;
  const html = groups.map(([t,ids])=>{ const got = ids.filter(id=>TAUGHT.has(id)); if(!got.length) return ""; any = true;
    return `<div class="pb-group"><div class="eyebrow">${t}</div>${got.map(id=>{ const e=LEX[id]; return `<div class="pb-row"><div><span class="ar">${e.ar}</span>${trOf(e.tr)}<div class="en">${e.en}${e.leb?` · Lebanese: <span class="ar" style="font-size:1rem">${e.leb}</span>`:""}</div></div>${playBtn(id,"Listen")}</div>`; }).join("")}</div>`; }).join("");
  modal(`<h2>Phrasebook</h2><p class="lead">Everything you have learned so far. It grows as you play.</p>${any?html:`<p>Nothing here yet. Open the first Learn cards and they will appear here.</p>`}`, m=>bindPlays(m));
}
function openSettings(){
  modal(`<h2>Settings</h2><div class="stack"><div><h3>Difficulty</h3><p class="lead" style="margin:2px 0 8px">Gentle: 3 options, automatic hints, no timer. Normal: 4 options, hint button, boss timer. Challenge: 5 options, timers everywhere, no hints or chip meanings.</p>
   <div class="opts-set" id="diff">${["gentle","normal","challenge"].map(d=>`<button data-d="${d}" aria-pressed="${S.diff===d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join("")}</div></div>
   <div><h3>Sound</h3><div class="opts-set"><button id="sfx" aria-pressed="${S.sfx}">Sound effects</button><button id="voice" aria-pressed="${S.voice}">Computer voice when a recording is missing</button></div></div>
   <div><h3>Computer voice speed</h3><div class="opts-set" id="rate">${[0.65,0.8,1].map(r=>`<button data-r="${r}" aria-pressed="${S.rate===r}">${r===0.65?"Slow":r===0.8?"Normal":"Natural"}</button>`).join("")}</div></div></div>`, m=>{
    m.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ S.diff=b.dataset.d; save(); m.querySelectorAll("[data-d]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
    m.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ S.rate=+b.dataset.r; save(); m.querySelectorAll("[data-r]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
    m.querySelector("#sfx").onclick = e=>{ S.sfx=!S.sfx; save(); e.target.setAttribute("aria-pressed",S.sfx); };
    m.querySelector("#voice").onclick = e=>{ S.voice=!S.voice; save(); e.target.setAttribute("aria-pressed",S.voice); };
  });
}
function openTeacher(){
  let entered = "";
  const m = modal(`<h2>🔑 Teacher panel</h2><p class="lead">Enter the PIN.</p><div class="pindots" id="dots"></div><div class="pin">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-k="${k}">${k}</button>`).join("")}</div>`, mm=>{
    mm.querySelectorAll(".pin [data-k]").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; if(k==="⌫") entered=entered.slice(0,-1); else entered+=k; mm.querySelector("#dots").textContent = "•".repeat(entered.length);
      if(entered.length===4){ if(entered===PIN){ mm.remove(); teacherPanel(); } else { entered=""; mm.querySelector("#dots").textContent=""; mm.querySelector(".sheet").classList.add("shake"); setTimeout(()=>mm.querySelector(".sheet").classList.remove("shake"),400); } } });
  });
}
function teacherPanel(){
  const codes = LEVELS.filter(l=>l.stop).map(l=>`<div class="pb-row"><div><b>Before ${l.boss?"the boss":"Level "+l.n}</b></div><div class="ar">${l.stop.map(id=>LEX[id].ar).join(" · ")}</div></div>`).join("");
  const clips = Object.keys(GROUPS).map(g=>`<h4 style="margin:14px 0 4px">${GROUPS[g]}</h4>` + CLIPS.filter(c=>c[1]===g).map(c=>{ const n=c[0]; return `<div class="cliprow"><span class="num">${pad(n)}</span><div><div class="ar">${clipText(c)}</div><div class="en" style="font-size:.78rem;color:var(--muted)">${pad(n)}.mp3</div></div><div style="display:flex;gap:6px;align-items:center"><span class="${AUDIO_READY.includes(n)?"st-ok":"st-miss"}">${AUDIO_READY.includes(n)?"file ready":"voice fallback"}</span><button class="play" data-pn="${n}">Play</button></div></div>`; }).join("")).join("");
  let armed = false;
  modal(`<h2>🔑 Teacher panel</h2>
   <h3>Jump to a level</h3><div class="lvbtns">${LEVELS.map((l,i)=>`<button class="btn small ghost" data-j="${i}">${l.boss?"Boss":"L"+l.n}</button>`).join("")}<button class="btn small ghost" data-cert>Certificate</button></div>
   <div class="row" style="margin-top:12px"><button class="btn small" id="unl">Unlock every STOP screen</button><button class="btn small ghost" id="rst">Reset all progress</button></div>
   <h3 style="margin-top:16px">STOP codes (say these three words, in order)</h3>${codes}
   <h3 style="margin-top:16px">Check every audio clip</h3><p class="lead" style="margin-top:2px">${AUDIO_READY.length} of ${CLIPS.length} recordings added. Missing ones use the computer voice (never for Qur'an).</p>${clips}
   <p class="note">Taught-before-seen check this session: ${window.__violations.length} problems.</p>`, m=>{
    m.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.j; LEVELS.slice(0,i).forEach(l=>{ if(!S.done.includes(l.n)) S.done.push(l.n); l.screens.forEach(s=>(s.ids||[]).forEach(teach)); }); save(); m.remove(); go({mode:"intro", li:i}); });
    m.querySelector("[data-cert]").onclick = ()=>{ m.remove(); go({mode:"cert"}); };
    m.querySelector("#unl").onclick = ()=>{ LEVELS.forEach(l=>{ if(!S.unlocked.includes(l.n)) S.unlocked.push(l.n); }); save(); toast("All STOP screens unlocked."); };
    m.querySelector("#rst").onclick = e=>{ if(!armed){ armed=true; e.target.textContent="Tap again to erase everything"; return; } S=Object.assign({},DEF); TAUGHT=new Set(); save(); m.remove(); go({mode:"map"}); };
    m.querySelectorAll("[data-pn]").forEach(b=>b.onclick=()=>{ const n=+b.dataset.pn; const c=CLIPS.find(x=>x[0]===n); playNum(n, clipText(c), LEX[c[2]].noTTS); });
  });
}

/* ---------- boot ---------- */
function boot(){
  
  $("#pb").onclick = openPhrasebook; $("#set").onclick = openSettings; $("#key").onclick = openTeacher;
  $("#home").onclick = ()=>go({mode:"map"});
  if("speechSynthesis" in window){ try{ speechSynthesis.getVoices(); }catch(e){} }
  render();
}
window.HR = { auto:()=>{ if(AUTO) AUTO(); return view; }, view:()=>view, state:()=>S, reset:()=>{ S=Object.assign({},DEF); TAUGHT=new Set(); save(); go({mode:"map"}); }, setDiff:d=>{ S.diff=d; save(); } };
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
