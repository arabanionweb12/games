<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>عملية صقر الصحراء · الحصة ٢</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>/* Layout: one centered "mission console" column on a dusk-desert sky; big tap targets, RTL. Single deliberate warm theme. */
:root{
  --sky1:#FFB36B; --sky2:#FF7E5F; --sky3:#7A3E8E;
  --sand:#F6E6C6; --dune:#E9C48A; --paper:#FFF9EE; --ink:#2A1C12; --muted:#7B6450;
  --teal:#0E8C8A; --alert:#E0412A; --gold:#F4B223; --ok:#2E9E55;
  --faris:#2E9E55; --aya:#6B4BD6; --me:#2E9E55;
  --f-ar:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;
  --f-ui:"Reem Kufi","Noto Kufi Arabic","Noto Naskh Arabic",sans-serif;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 100%) fixed;color:var(--ink);font-family:var(--f-ui);direction:rtl;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.p-aya{--me:var(--aya)}
body.p-faris{--me:var(--faris)}
#dunes{position:fixed;inset:auto 0 0 0;height:28vh;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
button{font-family:var(--f-ui);cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.9}
.bar{display:flex;align-items:center;gap:10px;background:rgba(255,249,238,.92);border-radius:999px;padding:6px 8px 6px 14px;box-shadow:0 6px 18px rgba(60,20,10,.18);margin-bottom:14px}
.bar .me{width:44px;height:44px;border-radius:50%;object-fit:cover;border:3px solid var(--me)}
.bar .nm{font-weight:700;font-size:1.05rem}
.bar .sp{flex:1}
.pill{background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 12px;font-size:.95rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.ibtn{background:var(--paper);border-radius:999px;padding:8px 12px;font-size:1rem;box-shadow:inset 0 0 0 2px var(--dune)}
.card{background:var(--paper);border-radius:var(--r);padding:18px;box-shadow:0 10px 30px rgba(60,20,10,.22)}
h1,h2,h3{margin:0;text-wrap:balance}
.title{font-size:clamp(1.6rem,4.5vw,2.6rem);color:var(--paper);text-shadow:0 3px 0 rgba(80,20,40,.35);text-align:center;margin:6px 0 2px}
.sub{color:var(--paper);text-align:center;opacity:.95;margin-bottom:16px;font-size:1.05rem}
.stamp{display:inline-block;border:3px solid var(--alert);color:var(--alert);border-radius:8px;padding:2px 10px;transform:rotate(-4deg);font-weight:700;letter-spacing:.04em;background:rgba(255,255,255,.6)}
/* picker */
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pcard{background:var(--paper);border-radius:24px;padding:14px;text-align:center;box-shadow:0 12px 30px rgba(60,20,10,.25);transition:transform .15s}
.pcard:hover{transform:translateY(-4px) rotate(-.5deg)}
.pcard img{width:100%;max-width:240px;aspect-ratio:1;object-fit:cover;border-radius:18px;border:5px solid var(--c)}
.pcard h2{font-size:1.7rem;margin-top:8px;color:var(--c)}
.pcard p{margin:4px 0 0;color:var(--muted)}
/* map */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lv{background:var(--paper);border-radius:16px;padding:12px;text-align:right;box-shadow:0 6px 16px rgba(60,20,10,.18);display:flex;flex-direction:column;gap:4px;min-height:118px;position:relative;border:3px solid transparent}
.lv .n{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lv .t{font-weight:700;font-size:1.08rem;line-height:1.35}
.lv .e{font-size:1.7rem}
.lv .s{margin-top:auto;color:var(--gold);letter-spacing:2px}
.lv.done{border-color:var(--ok)}
.lv.boss{background:#2A1C12;color:var(--paper)}
.lv.boss .n{color:var(--dune)}
/* tariq bubble */
.sidekick{display:flex;gap:12px;align-items:flex-start;background:rgba(255,249,238,.95);border-radius:18px;padding:12px;margin-block:12px}
.sidekick img{width:62px;height:62px;border-radius:50%;object-fit:cover;border:3px solid var(--alert);flex:none}
.sidekick .tx{flex:1;min-width:0}
.sidekick .who{font-weight:700;color:var(--alert);font-size:.95rem}
.sidekick .ar{font-size:1.25rem}
/* stop screen */
.stop{text-align:center}
.stop .big{font-size:clamp(2.4rem,9vw,4.4rem);color:var(--alert);font-weight:800}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin:12px auto;direction:ltr}
.pad button{height:58px;border-radius:14px;background:var(--sand);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:10px;justify-content:center;direction:ltr}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--dune);display:block}
.dots i.on{background:var(--ink)}
/* generic */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.center{display:flex;justify-content:center}
.btn{background:var(--me);color:#fff;border-radius:16px;padding:14px 22px;font-size:1.25rem;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.alt{background:var(--ink)}
.btn.ghost{background:var(--sand);color:var(--ink)}
.lvhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lvhead h2{font-size:1.5rem}
.inst{font-size:1.15rem;color:var(--muted);margin:4px 0 12px}
.big-ar{font-family:var(--f-ar);font-size:clamp(2rem,6.5vw,3.2rem);line-height:1.7;text-align:center;direction:rtl}
.mid-ar{font-family:var(--f-ar);font-size:clamp(1.35rem,4vw,1.9rem);line-height:1.8}
/* speak row */
.speak{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--sand);border-radius:14px;padding:8px 12px}
.speak .ar{flex:1;min-width:0;font-size:clamp(1.3rem,4vw,1.8rem)}
.sbtn{width:48px;height:48px;border-radius:50%;background:var(--paper);font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.sbtn.rec{background:var(--alert);color:#fff;animation:pulse 1s infinite}
.cnt{display:flex;gap:4px}
.cnt i{width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);display:block}
.cnt i.on{background:var(--gold)}
@keyframes pulse{50%{transform:scale(1.08)}}
/* explore */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{background:var(--paper);border-radius:16px;padding:10px;text-align:center;box-shadow:0 4px 0 var(--dune);display:flex;flex-direction:column;align-items:center;gap:4px}
.tile .ic{font-size:2.4rem;line-height:1.2;min-height:56px;display:flex;align-items:center}
.tile .ic img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.tile .ar{font-size:1.45rem}
.tile.wide{grid-column:1/-1;flex-direction:row;justify-content:space-between;text-align:right}
.sec-t{color:var(--paper);font-size:1.2rem;margin:16px 0 8px}
/* quiz */
.prompt{text-align:center;padding:10px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:12px}
.opt{background:var(--paper);border-radius:16px;padding:14px 10px;font-size:1.3rem;box-shadow:0 5px 0 var(--dune);min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.opt .ic{font-size:2.6rem}
.opt .ar{font-size:clamp(1.25rem,3.8vw,1.7rem)}
.opt.good{background:#D9F3E1;box-shadow:0 5px 0 var(--ok)}
.opt.bad{background:#FBD9D2;box-shadow:0 5px 0 var(--alert);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.progress{height:12px;border-radius:999px;background:var(--sand);overflow:hidden;margin:8px 0}
.progress b{display:block;height:100%;background:var(--me);transition:width .3s}
.threat{display:flex;align-items:center;gap:8px;margin:8px 0}
.threat .track{flex:1;height:22px;border-radius:999px;background:var(--sand);position:relative;overflow:hidden}
.threat .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--alert),var(--gold));transition:width .4s}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.3rem;min-width:56px;text-align:center;background:var(--ink);color:var(--paper);border-radius:12px;padding:4px 8px}
.hearts{font-size:1.4rem;letter-spacing:2px}
.scene{font-size:clamp(2.6rem,9vw,4.2rem);text-align:center;line-height:1.3}
.feedback{min-height:38px;text-align:center;font-size:1.3rem;font-weight:700;margin-top:8px}
/* video */
.vid{position:relative;border-radius:18px;overflow:hidden;background:#1d130c;aspect-ratio:16/9;width:100%;max-width:720px;margin:0 auto 12px}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
.vid .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--paper);background:radial-gradient(circle at 50% 120%,#E9C48A 0,#C9783E 35%,#3B1F2B 80%)}
.vid .fb .scene{filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.vid .fb .cap{font-size:1.1rem;opacity:.9;padding-inline:16px;text-align:center}
/* penalty */
.pitch{position:relative;background:linear-gradient(180deg,#5DBB63,#3E9B48);border-radius:18px;padding:14px;overflow:hidden}
.goal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border:6px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;height:150px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 14px),repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 2px,transparent 2px 14px);direction:ltr;position:relative}
.zone{background:rgba(255,255,255,.12);border-radius:8px;font-size:1.4rem;color:#fff;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.zone:hover{background:rgba(255,255,255,.3)}
.keeper{pointer-events:none;position:absolute;bottom:4px;left:50%;width:70px;height:70px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);transform:translateX(-50%);transition:left .35s,transform .35s}
.ball{font-size:2.4rem;text-align:center;transition:transform .45s ease-in;margin-top:10px}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mc{aspect-ratio:3/4;border-radius:14px;background:var(--ink);color:var(--paper);font-size:1.8rem;display:flex;align-items:center;justify-content:center;padding:4px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.mc.open{background:var(--paper);color:var(--ink)}
.mc.done{background:#D9F3E1;color:var(--ink);visibility:visible}
.mc .ar{font-size:clamp(1rem,3.4vw,1.5rem);line-height:1.5}
.mc img{width:70%;border-radius:50%}
/* order / build */
.chat{display:flex;flex-direction:column;gap:8px;min-height:60px;margin-bottom:12px}
.msg{display:flex;gap:8px;align-items:center;background:var(--sand);border-radius:16px;padding:8px 10px}
.msg img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.msg .ar{font-size:clamp(1.15rem,3.6vw,1.5rem);flex:1;min-width:0}
.msg.slot{border:2px dashed var(--dune);background:transparent;min-height:56px;justify-content:center;color:var(--muted)}
.pool{display:flex;flex-direction:column;gap:8px}
.pool .msg{background:var(--paper);box-shadow:0 4px 0 var(--dune);cursor:pointer}
.answer{min-height:74px;border:3px dashed var(--dune);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{background:var(--paper);border-radius:12px;padding:6px 14px;font-family:var(--f-ar);font-size:clamp(1.3rem,4vw,1.8rem);box-shadow:0 4px 0 var(--dune)}
.chip.sel{outline:3px solid var(--teal)}
.chip.placed{background:#D9F3E1;box-shadow:0 4px 0 var(--ok)}
/* sort */
.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.bin{border-radius:18px;min-height:150px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.bin h3{font-size:1.15rem}
.bin img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.bin.g{background:#3A2A20;color:var(--paper)}
.bin.a{background:#E7E0FF}
.bin .items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
/* maze */
.maze{display:grid;gap:4px;direction:ltr;max-width:360px;margin:0 auto 12px}
.cell{overflow:hidden;aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.cell.w{background:#B9864F;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.cell.r{background:#F3DDB3}
.cell.g{background:#FFE58A}
.car{height:78%;width:auto;max-width:78%;transition:transform .25s;pointer-events:none}
.meter{display:flex;gap:4px;font-size:1.4rem}
.cmds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmd{background:var(--paper);border-radius:14px;padding:10px;box-shadow:0 4px 0 var(--dune);font-family:var(--f-ar);font-size:clamp(1.3rem,4vw,1.7rem)}
/* meter (aya) */
.anger{height:24px;border-radius:999px;background:linear-gradient(90deg,#2E9E55,#F4B223,#E0412A);position:relative;margin:10px 0}
.anger i{position:absolute;top:-8px;width:8px;height:40px;background:var(--ink);border-radius:4px;transition:left .4s}
.guardface{width:110px;height:110px;border-radius:50%;object-fit:cover;border:5px solid var(--alert);display:block;margin:0 auto;transition:transform .3s,filter .3s}
/* roleplay */
.check{display:flex;align-items:center;gap:10px;background:var(--sand);border-radius:14px;padding:10px;font-family:var(--f-ar);font-size:clamp(1.2rem,3.6vw,1.6rem);text-align:right;width:100%}
.check.on{background:#D9F3E1}
.check .bx{width:30px;height:30px;border-radius:8px;border:3px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
/* win / cert */
.win{text-align:center}
.win .stars{font-size:3rem;letter-spacing:6px}
.cert{background:var(--paper);border:10px double var(--gold);border-radius:12px;padding:22px;text-align:center}
.cert img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid var(--me)}
.cert h2{font-size:2rem;color:var(--me)}
.tasks{display:flex;flex-direction:column;gap:8px;text-align:right;margin-top:12px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;z-index:60;font-size:1.05rem}
@media (max-width:520px){
  .pick{grid-template-columns:1fr 1fr;gap:10px}
  .pcard h2{font-size:1.3rem}
  .mem{grid-template-columns:repeat(4,minmax(0,1fr))}
  .opts{grid-template-columns:1fr 1fr}
  .goal{height:120px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
.vid .fb.ready{background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.45))}
.vid .fb.ready .scene,.vid .fb.ready .cap{display:none}
</style></head><body>
<canvas id="dunes" aria-hidden="true"></canvas>
<main id="app"></main>
<canvas id="confetti" aria-hidden="true"></canvas>

function confetti() {
  const c = $("#confetti"); if (!c) return; const x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#F4B223", "#E0412A", "#0E8C8A", "#6B4BD6", "#2E9E55", "#FFF9EE"];
  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, r: 4 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4, a: Math.random() * 6 }));
  let f = 0; (function tick() { x.clearRect(0, 0, c.width, c.height); ps.forEach(p => { p.y += p.vy; p.x += p.vx; p.a += .1; x.fillStyle = p.c; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6); x.restore(); }); if (++f < 150) requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height); })();
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

/* ---------- icons ---------- */
function arrow(dir) {
  const rot = { up: 0, right: 90, down: 180, left: 270 }[dir] || 0;
  return `<svg viewBox="0 0 100 100" width="58" height="58" style="transform:rotate(${rot}deg)" aria-hidden="true"><path d="M50 8 L86 50 H63 V92 H37 V50 H14 Z" fill="#0E8C8A" stroke="#2A1C12" stroke-width="5" stroke-linejoin="round"/></svg>`;
}
function icon(id) {
  const v = ICON[id] || "🔹";
  if (v.startsWith("arr:")) return arrow(v.slice(4));
  if (v.startsWith("img:")) return `<img src="${v.slice(4)}" alt="">`;
  return v;
}
function sceneHTML(s) { return s && s.startsWith("img:") ? `<img src="${s.slice(4)}" alt="" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--ink)">` : (s || ""); }

  return `<div class="speak" data-row="${id}"><span class="ar">${T(id)}</span>
    <button class="sbtn" data-play="${id}" aria-label="اسمع">🔊</button>
${cnt}</div>`;
}

/* ---------- STOP SCREEN ---------- */
function stopScreen(i) {
  const jid = i >= 0 ? JOKES[P][i] : JOKES[P][0];
  const l = i >= 0 ? LEVELS[P][i] : null;
  let code = "";
  render(`${topbar()}<div class="card stop">
    <div class="big">وَقِّف! 🛑</div>
    <h2 style="margin:6px 0">${l ? `الأستاذ محمد بيشرح «${l.title}» قبل ما نكمّل` : "تصفير التقدّم يحتاج الكود"}</h2>
    <p class="inst">الكود السري عند الأستاذ 🔐</p>
    <div class="dots" id="dots">${"<i></i>".repeat(4)}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "⌫", 0, "✔"].map(k => `<button data-k="${k}">${k}</button>`).join("")}</div>
  </div>${sidekick(jid)}`);
  setTimeout(() => play(jid), 300);
  const upd = () => $$("#dots i").forEach((d, n) => d.classList.toggle("on", n < code.length));
  $$("[data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k; sfx.click();
    if (k === "⌫") code = code.slice(0, -1);
    else if (k === "✔") check();
    else if (code.length < 4) { code += k; if (code.length === 4) setTimeout(check, 150); }
    upd();
  });
  function check() {
    if (code === CODE) { stopAudio(); sfx.lock(); if (i < 0) { save(P, { stars: {} }); toast("تم التصفير"); showMap(); } else startLevel(i); }
    else { sfx.bad(); code = ""; upd(); $(".pad").animate([{ transform: "translateX(-8px)" }, { transform: "translateX(8px)" }, { transform: "none" }], 300); }
  }
}

/* ---------- LEVEL FLOW: echo → game → exit password → win ---------- */
let LV = null, LI = 0, mistakes = 0;
function head(l) {

function startLevel(i) {
  LI = i; LV = LEVELS[P][i]; mistakes = 0;

}
function echo(ids, next, exit = false) {
  render(`${head(LV)}<div class="card">
    <h3>${exit ? "🔑 كلمة السر للخروج" : "🔁 تمرين الصدى"}</h3>
    <p class="inst">${exit ? G("قل الجمل الثلاث بصوت عالي عشان تطلع من الليفل!", "قولي الجمل الثلاث بصوت عالي عشان تطلعين من الليفل!") : G("اسمع 🔊 وكرّر بصوت عالي ٣ مرات. كل مرة تقولها دوس «قلتها ✔»", "اسمعي 🔊 وكرّري بصوت عالي ٣ مرات. كل مرة تقولينها دوسي «قلتها ✔»")}</p>
    <div style="display:flex;flex-direction:column;gap:10px">${ids.map(id => speakRow(id, { count: exit ? 1 : 3 })).join("")}</div>

  const need = exit ? 1 : 3, c = {};
  $$("[data-said]").forEach(b => b.onclick = () => {
    const id = b.dataset.said; c[id] = Math.min(need, (c[id] || 0) + 1); sfx.ok();
    $$(`[data-cnt="${id}"] i`).forEach((d, n) => d.classList.toggle("on", n < c[id]));
    if (ids.every(x => c[x] >= need)) { const g = $("#go"); g.disabled = false; g.style.opacity = 1; }
  });

}
function finishLevel() {
  const stars = mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1;
  const done = () => {
    const d = load(P); d.stars[LI] = Math.max(d.stars[LI] || 0, stars); save(P, d);
    confetti(); sfx.goal();
    const pr = PL.praise[Math.floor(Math.random() * PL.praise.length)];
    render(`${head(LV)}<div class="card win"><h2>${G("خلّصت الليفل!", "خلّصتي الليفل!")} 🎉</h2>
      <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
      <p class="inst">${mistakes === 0 ? "ولا غلطة! أسطورة 🏆" : `الأغلاط: ${mistakes}`}</p>
      <div class="row" style="justify-content:center">${LI + 1 < LEVELS[P].length ? `<button class="btn" id="nx">الليفل الجاي ⬅️</button>` : ""}<button class="btn alt" id="mp">🗺️ الخريطة</button></div></div>

    const nx = $("#nx"); if (nx) nx.onclick = () => stopScreen(LI + 1);
    $("#mp").onclick = showMap;
  };
  if (LV.echo && LV.type !== "explore") echo(LV.echo, done, true); else done();
}

/* ---------- generic QUIZ engine ---------- */
function quiz(cfg) {
  // cfg: items[{audio, prompt(html), opts:[{html, key, audio}], ans:key}], timer, bar, onDone, title
  let q = cfg.items.map(x => ({ ...x })), done = 0; const total = q.length;
  let threat = 0, t = null;
  const box = document.createElement("div"); box.className = "card";
  const area = cfg.mount || app(); area.appendChild(box);
  function next() {
    clearInterval(t);
    if (!q.length) { cfg.onDone && cfg.onDone(); return; }
    const it = q[0];
    const opts = shuffle(it.opts); box.dataset.ans = it.ans;
    box.innerHTML = `${cfg.bar ? `<div class="threat"><span>${cfg.bar}</span><div class="track"><div class="fill" style="width:${threat}%"></div></div><span>🏁</span></div>` : ""}
      <div class="progress"><b style="width:${(done / total) * 100}%"></b></div>
      <div class="row" style="justify-content:space-between"><span class="pill">${done + 1} / ${total}</span>${cfg.timer ? `<span class="timer" id="tm">${cfg.timer}</span>` : ""}</div>
      <div class="prompt">${it.prompt || ""}${it.audio ? `<div class="center" style="margin-top:8px"><button class="btn ghost" id="rep">🔊 ${G("اسمع", "اسمعي")}</button></div>` : ""}</div>
      <div class="opts">${opts.map(o => `<button class="opt" data-k="${o.key}">${o.html}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
    if (it.audio) { $("#rep", box).onclick = () => play(it.audio); setTimeout(() => play(it.audio), 250); }
    let locked = false;
    if (cfg.timer) {
      let s = cfg.timer; t = setInterval(() => { s--; const tm = $("#tm", box); if (tm) tm.textContent = s; if (s <= 0) { clearInterval(t); miss(null, true); } }, 1000);
    }
    function miss(btn, timeout) {
      mistakes++; sfx.bad();
      if (btn) btn.classList.add("bad");
      $("#fb", box).textContent = timeout ? "⏰ خلص الوقت!" : G("حاول مرة ثانية!", "حاولي مرة ثانية!");
      if (cfg.bar) { threat = Math.min(100, threat + 25); const f = $(".fill", box); if (f) f.style.width = threat + "%"; sfx.siren(); }
      play(PL.retry);
      if (cfg.bar && threat >= 100) { locked = true; clearInterval(t); setTimeout(() => cfg.onFail && cfg.onFail(), 900); return; }
      if (timeout || cfg.requeue !== false) { q.push(q.shift()); locked = true; setTimeout(next, 1100); }
    }
    $$(".opt", box).forEach(b => b.onclick = async () => {
      if (locked) return;
      if (b.dataset.k === it.ans) {
        locked = true; clearInterval(t); b.classList.add("good"); sfx.ok();
        $("#fb", box).textContent = "صح! 🎯";
        if (cfg.onCorrect) await cfg.onCorrect(it); else if (it.after) await playSeq([].concat(it.after));
        q.shift(); done++; setTimeout(next, 500);
      } else miss(b);
    });
  }
  next();
  return box;
}
function optHTML(id, showIcon = true) { return `${showIcon ? `<span class="ic">${icon(id)}</span>` : ""}<span class="ar">${T(id)}</span>`; }

  render(`${head(LV)}${videoBlock(LV.video, LV.fallback)}<div class="card"><p class="inst">${LV.inst}</p>
    <div class="prompt"><button class="btn ghost" id="hk">🔊 ${LV.hook.q}</button></div>
    <div class="opts" id="ho">${LV.hook.opts.map((o, n) => `<button class="opt" data-n="${n}"><span class="ic">${o.ic}</span><span>${o.t}</span></button>`).join("")}</div>
    <div class="feedback" id="hf"></div></div><div id="qm"></div>`);

    const o = LV.hook.opts[+b.dataset.n];
    if (o.ok) {
      b.classList.add("good"); sfx.ok(); $("#hf").textContent = "صح! 🎯";
      setTimeout(() => {
        const qm = $("#qm"); qm.innerHTML = `<p class="inst" style="color:var(--paper);margin-top:14px">${LV.quiz.inst}</p>`;
        const pool = LV.quiz.pool; const n = LV.quiz.n; const items = [];
        for (let k = 0; k < n; k++) { const ans = pool[k % pool.length]; const others = shuffle(pool.filter(x => x !== ans)).slice(0, PL.opts - 1); items.push({ audio: ans, prompt: `<div class="scene">🎧❓</div>`, ans, opts: [ans, ...others].map(x => ({ key: x, html: `<span class="ic">${icon(x)}</span>` })), after: ans }); }
        quiz({ items: shuffle(items), mount: qm, onDone: finishLevel });
        qm.scrollIntoView({ behavior: "smooth" });
      }, 700);
    } else { b.classList.add("bad"); sfx.bad(); mistakes++; }
  });
}

/* ---------- PENALTY (Faris, soccer) ---------- */
function penalty() {
  const dirs = [["f_yasar", "left", 0], ["f_siida", "up", 1], ["f_yameen", "right", 2]];
  let round = 0; const total = 12; const partB = 6;
  render(`${head(LV)}<div class="card"><p class="inst">${LV.inst}</p>
    <div class="row" style="justify-content:space-between"><span class="pill" id="rd">1 / ${total + partB}</span><span class="pill" id="sc">⚽ 0</span></div>
    <div class="pitch" style="margin-top:10px"><div class="goal" id="goal">
      <button class="zone" data-z="0">⬅️</button><button class="zone" data-z="1">⬆️</button><button class="zone" data-z="2">➡️</button>
      <img class="keeper" id="kp" src="${IMG.tariq}" alt="عم طارق"></div>
      <div class="ball" id="ball">⚽</div></div>
    <div id="pb"></div><div class="feedback" id="fb"></div></div>`);
  let goals = 0, cur = null, lock = false;
  const kp = $("#kp"), ball = $("#ball");
  function newRound() {
    lock = false; ball.style.transform = "none"; kp.style.left = "50%"; kp.style.transform = "translateX(-50%)";
    $("#rd").textContent = `${round + 1} / ${total + partB}`;
    if (round < total) {
      cur = dirs[Math.floor(Math.random() * 3)]; $("#goal").dataset.cur = cur[2]; $("#pb").innerHTML = `<div class="center" style="margin-top:10px"><button class="btn ghost" id="hear">🔊 ${G("اسمع الاتجاه", "اسمعي الاتجاه")}</button></div>`;
      $("#hear").onclick = () => play(cur[0]); setTimeout(() => play(cur[0]), 300);
    } else {
      cur = dirs[Math.floor(Math.random() * 3)]; $("#goal").dataset.cur = cur[0];
      $("#pb").innerHTML = `<p class="inst" style="text-align:center">الكورة راحت هنا ${arrow(cur[1])} … وش الكلمة؟</p><div class="opts">${shuffle(dirs).map(d => `<button class="opt" data-w="${d[0]}"><span class="ar">${T(d[0])}</span></button>`).join("")}</div>`;
      $$("[data-w]").forEach(b => b.onclick = () => shoot(b.dataset.w === cur[0] ? cur[2] : -1, b));
    }
  }
  function shoot(z, btn) {
    if (lock) return; lock = true;
    const okz = z === cur[2];
    const zx = [-130, 0, 130][z < 0 ? 1 : z];
    ball.style.transform = `translate(${zx}px,-150px) scale(.6)`;
    const dive = okz ? [2, 0, 1][cur[2]] : (z < 0 ? cur[2] : z);
    kp.style.left = ["18%", "50%", "82%"][dive];
    kp.style.transform = `translateX(-50%) rotate(${dive === 0 ? -35 : dive === 2 ? 35 : 0}deg)`;
    if (okz) { goals++; sfx.goal(); $("#fb").textContent = "قووووول! ⚽🔥"; play(cur[0]); if (btn) btn.classList.add("good"); }
    else { mistakes++; sfx.bad(); $("#fb").textContent = `صدّها عم طارق! 😅 الصح: ${T(cur[0])}`; if (btn) btn.classList.add("bad"); }
    $("#sc").textContent = "⚽ " + goals;
    setTimeout(() => { round++; $("#fb").textContent = ""; if (round >= total + partB) finishLevel(); else newRound(); }, 1400);
  }
  $$(".zone").forEach(b => b.onclick = () => { if (round < total && !lock) shoot(+b.dataset.z); });
  newRound();
}

/* ---------- MEMORY ---------- */
function memory() {
  const cards = shuffle(LV.pairs.flatMap(id => [{ id, kind: "ic" }, { id, kind: "w" }]));
  render(`${head(LV)}<div class="card"><p class="inst">${LV.inst}</p><div class="mem">${cards.map((c, n) => `<button class="mc" data-n="${n}" data-id="${c.id}">🦅</button>`).join("")}</div><div class="feedback" id="fb"></div></div>`);
  let open = [], found = 0, lock = false;
  $$(".mc").forEach(b => b.onclick = () => {
    const c = cards[+b.dataset.n]; if (lock || b.classList.contains("open") || b.classList.contains("done")) return;
    b.classList.add("open"); b.innerHTML = c.kind === "ic" ? icon(c.id) : `<span class="ar">${T(c.id)}</span>`; play(c.id);
    open.push([b, c]);
    if (open.length === 2) {
      lock = true; const [[b1, c1], [b2, c2]] = open;
      if (c1.id === c2.id && c1.kind !== c2.kind) { setTimeout(() => { b1.classList.add("done"); b2.classList.add("done"); sfx.ok(); open = []; lock = false; if (++found === LV.pairs.length) setTimeout(finishLevel, 700); }, 500); }
      else { mistakes += .5; setTimeout(() => { [b1, b2].forEach(x => { x.classList.remove("open"); x.innerHTML = "🦅"; }); open = []; lock = false; }, 1100); }
    }
  });
}

/* ---------- QUIZ level (radio) ---------- */
function quizLevel() {
  render(`${head(LV)}${LV.video ? videoBlock(LV.video, LV.fallback) : ""}<p class="inst" style="color:var(--paper)">${LV.inst}</p>`);
  wireVideo();
  const items = LV.items.map(it => ({ audio: it.audio, prompt: `<div class="row" style="justify-content:center"><img src="${IMG.tariq}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid var(--alert)" alt=""><span class="mid-ar">${T(it.audio)}</span></div>`,
    ans: it.ans, opts: it.opts.slice(0, Math.max(3, PL.opts - 1)).map(x => ({ key: x, html: optHTML(x, false) })), after: it.ans }));

/* ---------- ORDER dialogs ---------- */
function order() {
  let di = 0;
  const who = id => id.startsWith("t_") ? IMG.tariq : id.startsWith("g_") ? IMG.guard : PL.img;
  function one() {
    const lines = LV.dialogs[di]; let k = 0; const pool = shuffle(lines);
    render(`${head(LV)}<div class="card"><p class="inst">${LV.inst} (${di + 1} / ${LV.dialogs.length})</p>
      <div class="chat" id="chat">${lines.map(() => `<div class="msg slot">…</div>`).join("")}</div>
      <div class="pool">${pool.map(id => `<button class="msg" data-id="${id}"><img src="${who(id)}" alt=""><span class="ar">${T(id)}</span><span class="sbtn" data-prev="${id}">🔊</span></button>`).join("")}</div>
      <div class="feedback" id="fb"></div></div>`);
    $$("[data-prev]").forEach(s => s.onclick = e => { e.stopPropagation(); play(s.dataset.prev); });
    $$(".pool .msg").forEach(b => b.onclick = async () => {
      if (b.dataset.id === lines[k]) {
        sfx.ok(); const slot = $$("#chat .msg")[k]; slot.className = "msg"; slot.innerHTML = b.innerHTML.replace(/<span class="sbtn".*?<\/span>/, ""); b.remove(); k++;
        await play(lines[k - 1]);
        if (k === lines.length) { di++; setTimeout(() => di < LV.dialogs.length ? one() : finishLevel(), 600); }
      } else { mistakes++; sfx.bad(); b.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], 300); }
    });
  }
  one();
}

/* ---------- BUILD sentences ---------- */
function buildSentences(sents, mount, done) {
  let si = 0;
  function one() {
    const s = sents[si]; let k = 0; const pool = shuffle(s.tiles.map((t, n) => ({ t, n })));
    mount.innerHTML = `<div class="card"><p class="inst">${s.star ? "⭐ تحدّي B1! " : ""}${LV.inst} (${si + 1} / ${sents.length})</p>
      <div class="answer" id="ans"></div><div class="row" id="pool">${pool.map(p => `<button class="chip" data-n="${p.n}">${p.t}</button>`).join("")}</div>
      <div id="after"></div></div>`;
    $$("#pool .chip", mount).forEach(b => b.onclick = async () => {
      if (+b.dataset.n === k) {
        sfx.click(); b.classList.add("placed"); $("#ans", mount).appendChild(b); b.onclick = null; k++;
        if (k === s.tiles.length) {
          sfx.ok(); await playSeq(s.audio);
          const key = s.audio[s.audio.length - 1];
          $("#after", mount).innerHTML = `<p class="inst" style="margin-top:10px">${G("الحين قلها بصوت عالي! 🗣️", "الحين قوليها بصوت عالي! 🗣️")}</p>${s.audio.map(a => speakRow(a)).join("")}<div class="center" style="margin-top:10px"><button class="btn" id="nx">${G("قلتها ✔ التالي", "قلتها ✔ التالي")}</button></div>`;
          wireSpeak(mount);
          $("#nx", mount).onclick = () => { si++; si < sents.length ? one() : done(); };
        }
      } else { mistakes++; sfx.bad(); b.animate([{ transform: "translateY(-6px)" }, { transform: "none" }], 250); }
    });
  }
  one();
}
function build() {
  render(`${head(LV)}<div id="bm"></div>`);
  buildSentences(LV.sents, $("#bm"), finishLevel);
}

/* ---------- MAZE (Faris) ---------- */
const MAZES = [
  ["#G###", "#.###", "#...#", "###.#", "###S#"],
  ["G..##", "##.##", "##..#", "###.#", "###S#"],
  ["#...G", "#.#D#", "#.#.#", "#...#", "##S##"]
];
function maze() {
  let mi = 0, panic = 0;
  const DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]]; // up,right,down,left
  function one() {
    const M = MAZES[mi].map(r => r.split("")); let pos, h = 0;
    M.forEach((r, y) => r.forEach((c, x) => { if (c === "S") pos = [y, x]; }));
    render(`${head(LV)}<div class="card"><p class="inst">${LV.inst} (${mi + 1} / ${MAZES.length})</p>
      <div class="row" style="justify-content:space-between"><span>خوف عم طارق:</span><span class="meter" id="pm"></span></div>
      <div class="maze" id="mz" style="grid-template-columns:repeat(${M[0].length},1fr)"></div>
      <div class="cmds">${[["f_p_rooh", "F"], ["f_p_liffR", "R"], ["f_p_liffL", "L"], ["f_p_irja3", "B"]].map(([id, c]) => `<button class="cmd" data-c="${c}" data-a="${id}">${T(id)}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div></div>${sidekick("j_f5")}`);
    const draw = () => {
      $("#mz").innerHTML = M.map((r, y) => r.map((c, x) => {
        const here = pos[0] === y && pos[1] === x;
        const cls = c === "#" ? "w" : c === "G" ? "g" : "r";
        const inner = here ? `<svg class="car" viewBox="0 0 40 60" style="transform:rotate(${h * 90}deg)"><rect x="6" y="4" width="28" height="52" rx="9" fill="#fff" stroke="#2A1C12" stroke-width="3"/><rect x="11" y="12" width="18" height="11" rx="3" fill="#7EC8E3"/><rect x="11" y="38" width="18" height="9" rx="3" fill="#7EC8E3"/><circle cx="20" cy="4" r="3" fill="#F4B223"/></svg>` : c === "G" ? "🏁" : c === "D" ? "🚙" : "";
        return `<div class="cell ${cls}">${inner}</div>`;
      }).join("")).join("");
      $("#pm").textContent = "😰".repeat(panic) + "🙂".repeat(Math.max(0, 5 - panic));
    };
    draw();
    $$(".cmd").forEach(b => b.onclick = async () => {
      const c = b.dataset.c; play(b.dataset.a);
      let nh = h, step;
      if (c === "R") nh = (h + 1) % 4; if (c === "L") nh = (h + 3) % 4;
      step = c === "B" ? DIRS[(h + 2) % 4] : DIRS[nh];
      const ny = pos[0] + step[0], nx = pos[1] + step[1];
      const cell = M[ny] && M[ny][nx];
      await new Promise(r => setTimeout(r, 700));
      if (!cell || cell === "#") { panic++; mistakes++; sfx.bad(); $("#fb").textContent = "🧱 جدار!"; play("t_wall"); }
      else if (cell === "D") { panic++; mistakes++; sfx.siren(); $("#fb").textContent = "🚙 سيارة الدوسري! ارجع ورا!"; play("t_dawsari"); }
      else { h = c === "B" ? h : nh; pos = [ny, nx]; sfx.click(); $("#fb").textContent = ""; }
      draw();
      if (panic >= 5) { toast("عم طارق انهار من الخوف 😂 نعيدها!"); panic = 0; setTimeout(one, 1200); return; }
      if (M[pos[0]][pos[1]] === "G") { sfx.goal(); confetti(); play("t_abshir"); $("#fb").textContent = "وصلنا! 🏁"; mi++; setTimeout(() => mi < MAZES.length ? one() : finishLevel(), 1600); }
    });
  }
  one();
}

/* ---------- BOSS ---------- */
function boss() {
  render(`${head(LV)}${LV.video ? videoBlock(LV.video, LV.fallback) : ""}<p class="inst" style="color:var(--paper)">${LV.inst}</p><div id="lk"></div>`);
  wireVideo();
  let locks = 0;
  const lockRow = () => LV.locks ? `<div class="center" style="font-size:2rem;letter-spacing:6px;margin:6px 0">${"🔓".repeat(locks)}${"🔒".repeat(LV.items.length - locks)}</div>` : "";
  if (LV.locks) $("#lk").innerHTML = lockRow();
  const items = LV.items.map(it => ({ audio: it.audio, ans: it.ans,
    prompt: `<div class="scene">${it.scene || `<img src="${IMG.guard}" style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid var(--alert)" alt="">`}</div><div class="mid-ar" style="margin-top:6px">${it.t}</div>`,
    opts: it.opts.slice(0, PL.opts).map(x => ({ key: x, html: optHTML(x, false) })), after: it.ans }));
  quiz({ items, timer: PL.bossTime, bar: LV.bar, requeue: true,
    onCorrect: async it => { if (LV.locks) { locks++; sfx.lock(); $("#lk").innerHTML = lockRow(); } await play(it.ans); },
    onFail: () => { toast(P === "faris" ? "مسكونا! 😱 نعيدها؟" : "وصلوا عيال الدوسري! 😱 نعيدها؟"); setTimeout(boss, 1200); },
    onDone: async () => {
      confetti(); sfx.goal();
      if (LV.endVideo) { $("#app").insertAdjacentHTML("beforeend", videoBlock(LV.endVideo, LV.fallback)); wireVideo(); }
      await play(LV.win); setTimeout(finishLevel, 1200);
    } });
}

/* ---------- ROLEPLAY (live with teacher) ---------- */
function roleplay() {
  const npc = LV.npc === "tariq" ? IMG.tariq : IMG.guard;
  let lives = 3, sec = 120, tm = null;
  render(`${head(LV)}<div class="card"><div class="row"><img src="${npc}" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:4px solid var(--alert)" alt="">
    <div style="flex:1;min-width:0"><h3>الأستاذ = ${LV.npcName}</h3><p class="inst" style="margin:4px 0">${LV.inst}</p></div></div>
    <div class="row" style="justify-content:space-between;margin:8px 0"><span class="timer" id="rt">2:00</span><span class="hearts" id="hl">❤️❤️❤️</span>
      <button class="btn ghost" id="st">▶ ابدأ</button><button class="btn ghost" id="stt">${LV.rule.split("=")[1]}</button></div>
    <p class="inst">🧑‍🏫 الأستاذ يعلّم على كل جملة ${G("قالها", "قالتها")} ${PL.name}:</p>
    <div style="display:flex;flex-direction:column;gap:8px">${LV.checks.map(id => `<button class="check" data-c="${id}"><span class="bx"></span><span style="flex:1">${T(id)}</span><span class="sbtn" data-pv="${id}">🔊</span></button>`).join("")}</div>
    <p class="inst" style="margin-top:8px">📏 ${LV.rule}</p>
    <div class="center"><button class="btn" id="fin">🏁 خلّصنا الرول بلاي</button></div></div>`);
  $$("[data-pv]").forEach(s => s.onclick = e => { e.stopPropagation(); play(s.dataset.pv); });
  $$(".check").forEach(b => b.onclick = () => { b.classList.toggle("on"); $(".bx", b).textContent = b.classList.contains("on") ? "✔" : ""; sfx.ok(); });
  $("#st").onclick = () => { clearInterval(tm); tm = setInterval(() => { sec--; $("#rt").textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; if (sec <= 0) { clearInterval(tm); sfx.siren(); toast("⏰ خلص الوقت!"); } }, 1000); };
  $("#stt").onclick = () => { lives = Math.max(0, lives - 1); mistakes++; sfx.bad(); $("#hl").textContent = "❤️".repeat(lives) + "🖤".repeat(3 - lives); };
  $("#fin").onclick = () => { clearInterval(tm); const n = $$(".check.on").length; mistakes = n >= 6 ? 0 : n >= 4 ? 2 : 5; mistakes += 3 - lives; finishLevel(); };
}

/* ---------- HOME (talk to Mom) + certificate ---------- */

  render(`${head(LV)}<p class="inst" style="color:var(--paper)">${LV.inst}</p>`);
  const items = LV.items.map(it => ({ audio: it.audio, ans: it.ans,

  quiz({ items, onCorrect: async it => { toast("💡 " + it.note); await play(it.ans); }, onDone: async () => {
    await play(LV.done); certificate();
  } });
}
function certificate() {
  const d = new Date().toLocaleDateString("ar-SA-u-nu-arab", { year: "numeric", month: "long", day: "numeric" });
  render(`${head(LV)}<div class="cert"><span class="stamp">مهمة مكتملة</span>
    <div style="margin-top:10px"><img src="${PL.img}" alt=""></div>
    <h2>${PL.name}</h2><div class="big-ar">${LV.cert}</div>
    <p>عملية صقر الصحراء · الحصة ٢ · ${PL.mission}</p><p class="pill" style="display:inline-block">⭐ ${totalStars(P)}</p><p style="color:var(--muted)">${d}</p>
    <div class="tasks"><h3>🏠 مهام البيت هذا الأسبوع</h3>${LV.tasks.map(t => `<button class="check"><span class="bx"></span><span style="flex:1">${t}</span></button>`).join("")}</div>

/* ---------- SORT (Aya) ---------- */
function sort() {
  let sel = null, left = LV.items.length;
  render(`${head(LV)}<div class="card"><p class="inst">${LV.inst}</p>
    <div class="row" id="pool">${shuffle(LV.items).map((it, n) => `<button class="chip" data-i="${LV.items.indexOf(it)}">${it.t}</button>`).join("")}</div>
    <div class="bins"><button class="bin g" data-s="g"><img src="${IMG.guard}" alt=""><h3>الحارس يقول</h3><div class="items"></div></button>
    <button class="bin a" data-s="a"><img src="${IMG.aya}" alt=""><h3>آية تقول</h3><div class="items"></div></button></div><div class="feedback" id="fb"></div></div>`);
  $$("#pool .chip").forEach(b => b.onclick = () => { $$("#pool .chip").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = b; play(LV.items[+b.dataset.i].a); });
  $$(".bin").forEach(bin => bin.onclick = () => {
    if (!sel) { $("#fb").textContent = "اختاري جملة أول 👆"; return; }
    const it = LV.items[+sel.dataset.i];
    if (it.side === bin.dataset.s) { sfx.ok(); sel.classList.remove("sel"); sel.classList.add("placed"); $(".items", bin).appendChild(sel); sel.onclick = null; sel = null; $("#fb").textContent = "صح! 🎯"; if (--left === 0) setTimeout(finishLevel, 700); }
    else { mistakes++; sfx.bad(); $("#fb").textContent = "لا… فكّري: مين يقول هالكلام؟"; }
  });
}

/* ---------- METER (Aya) ---------- */
function meter() {
  let ti = 0, anger = 70;
  function one() {
    const tr = LV.turns[ti];
    render(`${head(LV)}<div class="card"><p class="inst">${LV.inst} (${ti + 1} / ${LV.turns.length})</p>
      <img class="guardface" id="gf" src="${IMG.guard}" alt="الحارس"><div class="anger"><i id="ai" style="left:calc(${anger}% - 4px)"></i></div>
      <div class="row" style="justify-content:space-between;font-size:.95rem"><span>😊 راضي</span><span>😡 معصّب</span></div>
      <div class="prompt"><div class="mid-ar">${T(tr.g)}</div><button class="btn ghost" id="rep">🔊 ${G("اسمع", "اسمعي")}</button></div>
      <div class="opts">${shuffle(tr.opts).map(([id, d]) => `<button class="opt" data-id="${id}" data-d="${d}">${optHTML(id, false)}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div></div>`);
    $("#rep").onclick = () => play(tr.g); setTimeout(() => play(tr.g), 250);
    let locked = false;
    $$(".opt").forEach(b => b.onclick = async () => {
      if (locked) return; locked = true;
      const d = +b.dataset.d; anger = Math.max(0, Math.min(100, anger + d));
      $("#ai").style.left = `calc(${anger}% - 4px)`;
      await play(b.dataset.id);
      if (d < 0) { b.classList.add("good"); sfx.ok(); $("#gf").style.transform = "scale(.95)"; $("#fb").textContent = "الزعل نزل 😌"; await play(anger < 40 ? "g_soft" : "g_hmm"); ti++; }
      else { b.classList.add("bad"); sfx.bad(); mistakes++; $("#gf").style.transform = "scale(1.12) rotate(-3deg)"; $("#fb").textContent = d > 15 ? "أوووه… الحارس عصّب! 😡 بدون «لو سمحت»؟" : "هذا ما يفيد هنا 🤔"; await play("g_angry"); }
      setTimeout(() => {
        if (ti >= LV.turns.length) { if (anger <= 40) { play("g_open"); confetti(); setTimeout(finishLevel, 1800); } else { toast("الحارس لسه زعلان… نعيد بأدب أكثر!"); ti = 0; anger = 70; one(); } }
        else one();
      }, 900);
    });
  }
  one();
}

/* ---------- dunes ---------- */
function dunes() {
  const c = $("#dunes"); if (!c) return; const x = c.getContext("2d");
  const r = () => { c.width = innerWidth; c.height = c.clientHeight; x.clearRect(0, 0, c.width, c.height);
    [["#C98B4E", .55], ["#B0703A", .75], ["#8C5530", .92]].forEach(([col, base], i) => { x.fillStyle = col; x.beginPath(); x.moveTo(0, c.height);
      for (let px = 0; px <= c.width; px += 10) x.lineTo(px, c.height * base - Math.sin(px / (180 + i * 60) + i) * 26 - Math.sin(px / 70 + i * 2) * 6);
      x.lineTo(c.width, c.height); x.fill(); }); };
  r(); addEventListener("resize", r);
}
if(document.readyState==="loading"){addEventListener("DOMContentLoaded",()=>{dunes();home();});}else{dunes();home();}
