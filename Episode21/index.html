<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Projections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Spectral:ital,wght@0,600;0,700;1,500&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --midnight:#0E1E22;--midnight-2:#16303a;--paper:#F2ECDE;--panel:#FBF7EC;--paper-2:#E7DECB;
  --ink:#182420;--ink-soft:#5E6560;--line:rgba(24,36,32,.14);
  --brass:#C29A46;--brass-deep:#A57F2E;--emerald:#0F6B4E;--teal:#1C7168;--copper:#BC7A34;
  --good:#1f8a5b;--good-soft:#d9f1e4;--bad:#c2453a;--bad-soft:#f8dedb;--sky:#2f6fb5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
.ar{font-family:'Noto Naskh Arabic','Geeza Pro','Arial',serif !important;direction:rtl;unicode-bidi:isolate;font-weight:700;line-height:1.75}
button{font-family:inherit;cursor:pointer}
.hidden{display:none !important}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--midnight);color:#EDE8DA;display:flex;align-items:center;gap:10px;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar .title{font-family:'Spectral',serif;font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .title small{font-family:'Inter';font-weight:500;color:#9fb0a6;font-size:12px;margin-left:6px}
.tb-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#EDE8DA;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600}
.chip-me{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;background:rgba(194,154,70,.16);border:1px solid rgba(194,154,70,.4);padding:4px 10px 4px 4px;border-radius:30px}
.chip-me .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#fff}
.stars-tot{font-size:13px;color:var(--brass);font-weight:700}

main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 30px -22px rgba(14,30,34,.5)}
.h1{font-family:'Spectral',serif;font-weight:700;font-size:clamp(26px,4.4vw,38px);line-height:1.1;margin:0 0 6px}
.h2{font-family:'Spectral',serif;font-weight:700;font-size:clamp(21px,3.2vw,27px);line-height:1.15;margin:0 0 8px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-deep)}
.muted{color:var(--ink-soft)}
.btn{border:none;border-radius:14px;padding:13px 22px;font-size:16px;font-weight:700;background:var(--emerald);color:#fff;box-shadow:0 4px 0 #0a4d38;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a4d38}
.btn.brass{background:var(--brass);color:#2a2210;box-shadow:0 4px 0 var(--brass-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.big{font-size:19px;padding:16px 30px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.spacer{height:14px}

/* hero / select */
.hero{background:var(--midnight);color:#F2ECDE;border-radius:24px;padding:26px 22px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 90% -10%,rgba(194,154,70,.25),transparent 60%),radial-gradient(60% 60% at 0% 120%,rgba(15,107,78,.3),transparent 60%);pointer-events:none}
.hero > *{position:relative}
.hero .eyebrow{color:var(--brass)}
.hero .ar-title{font-size:clamp(36px,7vw,60px);color:#F6F0E2;margin:4px 0 0}
.hero .en-title{font-family:'Spectral',serif;font-style:italic;color:var(--brass);font-size:clamp(20px,3.4vw,28px);margin:0 0 8px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
@media(max-width:760px){.badges{grid-template-columns:repeat(2,1fr)}}
.badge{background:#FBF7EC;color:var(--ink);border-radius:18px;border:none;padding:0 0 14px;text-align:center;overflow:hidden;position:relative;transition:transform .18s, box-shadow .18s;box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.badge:hover{transform:translateY(-4px) rotate(-1deg)}
.badge .lanyard{height:16px;background:repeating-linear-gradient(90deg,var(--brass) 0 10px,var(--brass-deep) 10px 20px)}
.badge .bhead{font-size:10px;letter-spacing:.16em;font-weight:800;text-transform:uppercase;color:#fff;padding:5px 0}
.badge svg{width:84px;height:84px;margin:10px auto 0;display:block}
.badge .bname{font-size:30px;margin:2px 0 0;line-height:1.4}
.badge .ben{font-weight:700;font-size:14px}
.badge .brole{font-size:12px;color:var(--ink-soft);margin-top:2px}
.badge .bstars{font-size:13px;color:var(--brass-deep);font-weight:700;margin-top:6px;min-height:18px}

/* level map */
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
@media(max-width:700px){.map{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.map{grid-template-columns:1fr}}
.lvl{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;position:relative;min-height:128px;transition:transform .15s}
.lvl:hover:not(.locked){transform:translateY(-3px);border-color:var(--emerald)}
.lvl .ln{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--brass-deep);text-transform:uppercase}
.lvl .lt{font-family:'Spectral',serif;font-size:19px;font-weight:700;line-height:1.15;margin:4px 0}
.lvl .ld{font-size:12.5px;color:var(--ink-soft)}
.lvl .ls{position:absolute;right:14px;top:12px;color:var(--brass);font-size:15px;letter-spacing:1px}
.lvl.locked{opacity:.5;cursor:not-allowed}
.lvl.boss{background:var(--midnight);color:#F2ECDE}
.lvl.boss .ld{color:#aebbb3}
.lvl.next{outline:3px solid var(--brass);outline-offset:2px}

/* explain screen */
.explain{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start}
@media(max-width:700px){.explain{grid-template-columns:1fr}.explain .who{max-width:150px;margin:0 auto}}
.explain .who svg{width:100%;height:auto;display:block}
.bubble{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:14px 16px;position:relative;font-size:15px}
.bubble.layla{border-color:var(--teal);background:#eef7f5}
.bubble .who-n{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:3px}
.rule{background:var(--midnight);color:#F2ECDE;border-radius:16px;padding:16px 18px;margin:12px 0}
.rule .ar{color:#fff}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:15px;margin:10px 0}
.eq .box{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 14px;text-align:center}
.eq .box .ar{font-size:30px;display:block;line-height:1.5}
.eq .box small{display:block;color:var(--ink-soft);font-size:12px}
.eq .op{font-size:24px;font-weight:800;color:var(--brass-deep)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
@media(max-width:600px){.tri{grid-template-columns:1fr}}
.tri > div{border-radius:14px;padding:12px;text-align:center;border:2px solid var(--line);background:#fff}
.tri .ar{font-size:30px;display:block}
.tri b{display:block;font-size:17px}
.tri small{color:var(--ink-soft)}
.tri small .ar,.eq small .ar,.train small .ar{font-size:1.25em !important;display:inline !important;line-height:1.4}

/* audio/speak bar */
.speak{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.sbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;font-size:14px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.sbtn.rec{border-color:#e4b9b4}
.sbtn.rec.on{background:var(--bad);color:#fff;border-color:var(--bad);animation:pulse 1s infinite}
.sbtn:disabled{opacity:.4}
@keyframes pulse{50%{transform:scale(1.06)}}
.phrase{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.phrase .ar{font-size:clamp(24px,4.4vw,32px);text-align:right}
.phrase .en{color:var(--ink-soft);font-size:14px}

.chkbtn{border-color:#9fd3b8}
.chkbtn.on{background:var(--good);color:#fff;border-color:var(--good);animation:pulse 1s infinite}
.chk{margin-top:8px;border-radius:12px;padding:8px 12px;font-size:14px;animation:pop .25s}
.chk.ok{background:var(--good-soft);border:2px solid var(--good)}
.chk.mid{background:#fff3d6;border:2px solid #e9cf8f}
.chk.no{background:var(--bad-soft);border:2px solid var(--bad)}
.chk-words{font-size:24px;text-align:right}
.chk-words .w-ok{color:var(--good)}
.chk-words .w-no{color:var(--bad);text-decoration:underline wavy}
.chk .note .ar{font-size:16px}
#tbar2{position:sticky;top:52px;z-index:19;background:#2a2210;color:#fff;border-bottom:2px solid var(--brass);padding:6px 10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#tbar2 button{background:var(--brass);color:#2a2210;border:none;border-radius:10px;padding:6px 9px;font-weight:800;font-size:12.5px}
#tbar2 .tlabel{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);align-self:center;padding:0 6px}

body.teacher .opt[data-ok="1"]{outline:3px dashed var(--brass);outline-offset:2px}
body.teacher .chipw::after{content:attr(data-hint);display:block;font:700 10px Inter;color:var(--brass-deep);direction:ltr}
body.nomic .sbtn.rec,body.nomic .sbtn[data-a="cmp"],body.nocheck .chkbtn{display:none !important}
#tlogin{display:flex;gap:8px;justify-content:center;margin-top:8px}
#tlogin input{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.tlink{background:none;border:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;margin-top:6px}
@media print{
  body.printing-cert *{visibility:hidden !important}
  body.printing-cert .cert,body.printing-cert .cert *{visibility:visible !important}
  body.printing-cert .cert{position:fixed;left:0;top:0;width:100%;margin:0;border-width:10px}
  body.printing-cert .topbar,body.printing-cert #tbar2{display:none !important}
  @page{size:A4 landscape;margin:12mm}
}
/* explore */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.vcard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center;min-height:132px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;transition:transform .15s,border-color .15s}
.vcard:hover{transform:translateY(-2px)}
.vcard.done{border-color:var(--good);background:var(--good-soft)}
.vcard .ar{font-size:28px;line-height:1.5}
.vcard .ic{font-size:26px;line-height:1}
.vcard .en{font-size:13px;color:var(--ink-soft);font-weight:600}
.vcard .tag{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brass-deep)}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.pbar{flex:1;height:10px;background:var(--paper-2);border-radius:10px;overflow:hidden}
.pbar > i{display:block;height:100%;background:var(--emerald);border-radius:10px;transition:width .3s}
.qcount{font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.second{display:inline-block;background:#fff3d6;color:#7a5a12;border:1px solid #e9cf8f;font-size:12px;font-weight:800;padding:3px 9px;border-radius:20px;margin-bottom:8px;letter-spacing:.04em}
.prompt{font-size:17px;font-weight:600;margin:4px 0 12px}
.prompt .ar{font-size:clamp(26px,5vw,36px)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600;color:var(--ink);text-align:center;min-height:60px;transition:transform .1s,border-color .15s}
.opt .ar{font-size:clamp(22px,4.2vw,28px)}
.opt:hover:not(:disabled){border-color:var(--emerald);transform:translateY(-2px)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;font-size:15px;display:flex;flex-direction:column;gap:6px;animation:pop .25s}
.fb.ok{background:var(--good-soft);border:2px solid var(--good)}
.fb.no{background:var(--bad-soft);border:2px solid var(--bad)}
.fb .fbt{font-weight:800;font-size:16px}
.fb .why{background:rgba(255,255,255,.7);border-radius:12px;padding:10px 12px}
.fb .why b{color:var(--emerald)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* place (timeline/sort) */
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0;min-height:56px}
.chipw{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:4px 14px;font-size:24px}
.chipw.sel{background:var(--brass);border-color:var(--brass-deep);transform:translateY(-3px)}
.chipw.used{visibility:hidden}
.slots{display:grid;gap:10px}
.slot{border:3px dashed var(--line);border-radius:16px;padding:10px;min-height:86px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .15s}
.slot.hot{border-color:var(--brass);background:#fffaf0}
.slot .sl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.slot .ar{font-size:22px}
.slot .ic{font-size:22px}
.timeline{grid-template-columns:repeat(4,1fr)}
@media(max-width:620px){.timeline{grid-template-columns:repeat(2,1fr)}}
.bins{grid-template-columns:1fr 1fr}
.bin-in{display:flex;flex-direction:column;gap:6px;width:100%}
.bin-in .ar{font-size:19px;background:var(--good-soft);border-radius:10px;padding:2px 8px;text-align:center}
.sortitem{font-size:22px;padding:8px 14px}

/* build */
.buildrow{direction:rtl;min-height:70px;border:3px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-start;background:#fff}
.tile{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:2px 14px;font-size:26px}
.tile.inrow{background:#fff7e3;border-color:var(--brass-deep)}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{aspect-ratio:1/1.05;border-radius:14px;border:none;background:var(--midnight);color:var(--brass);font-size:26px;font-weight:800;display:grid;place-items:center;padding:6px;transition:transform .3s}
.mcard.open{background:#fff;color:var(--ink);border:2px solid var(--brass)}
.mcard.open .ar{font-size:clamp(18px,4vw,26px)}
.mcard.gone{background:var(--good-soft);border:2px solid var(--good);color:var(--ink)}
.mcard .en{font-size:13px;font-weight:700}

/* order */
.dlg{display:flex;flex-direction:column;gap:8px}
.dline{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;text-align:right;display:flex;align-items:center;gap:10px;justify-content:space-between}
.dline .who{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brass-deep);direction:ltr;flex:none}
.dline .ar{font-size:20px}
.dline.placed{background:var(--good-soft);border-color:var(--good)}

/* meter */
.meter{height:26px;background:var(--paper-2);border-radius:20px;overflow:hidden;position:relative;border:2px solid var(--ink)}
.meter > i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--bad),var(--brass),var(--good));transition:width .6s}
.meter span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:13px}

/* scene */
.scene{width:100%;border-radius:18px;overflow:hidden;background:var(--midnight);position:relative;aspect-ratio:16/9}
.scene svg,.scene video{width:100%;height:100%;display:block;object-fit:cover}

/* stars/done */
.bigstars{font-size:48px;color:var(--brass);letter-spacing:6px}
.cert{background:#fffdf6;border:10px double var(--brass);border-radius:16px;padding:28px 20px;text-align:center}
.cert .ar{font-size:34px}
.timer{height:6px;background:var(--paper-2);border-radius:6px;overflow:hidden;margin-bottom:10px}
.timer > i{display:block;height:100%;background:var(--copper);width:100%}
.hearts{font-size:18px;color:var(--bad)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--midnight);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:92vw;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.checklist label{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0;font-weight:600}
.checklist input{width:22px;height:22px;accent-color:var(--emerald)}
.note{font-size:13px;color:var(--ink-soft)}
.joke{margin-top:14px}
.magnet{font-size:44px;background:var(--bad);color:#fff;border:none;border-radius:16px 16px 30px 30px;padding:0 20px;box-shadow:0 5px 0 #8f2f27}
.verbbox{font-size:44px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:0 20px;min-width:150px;text-align:center;transition:all .3s}
.verbbox.fut{border-color:var(--good);background:var(--good-soft)}
.train{display:flex;direction:rtl;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.train > div{border-radius:12px;padding:4px 14px;text-align:center;color:#fff}
.train .ar{font-size:30px;display:block}
.train small{direction:ltr;display:block;font-size:11px;font-weight:700}
.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:520px){.avatars{grid-template-columns:repeat(2,1fr)}}
.avbtn{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.avbtn svg{width:64px;height:64px}
.avbtn .ar{font-size:20px;display:block}
</style>
</head>
<body>
<div class="topbar">
  <button class="tb-btn" id="homeBtn" title="Map">&#9776; Map</button>
  <div class="title" id="tbTitle">Future Projections <small>Episode 21</small></div>
  <span class="stars-tot" id="tbStars"></span>
  <span class="chip-me hidden" id="tbMe"></span>
</div>
<main id="stage"></main>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<script src="audio.js"></script>
<script>
/* =========================================================
   DATA
   ========================================================= */
const PLAYERS={
  ali:{id:'ali',en:'Ali',ar:'عَلِي',g:'m',color:'#2f6fb5',role:'Report writer',taskAr:'التَّقْرِير',taskEn:'the report',verb:'k'},
  andy:{id:'andy',en:'Andy',ar:'أَنْدِي',g:'m',color:'#BC7A34',role:'Code builder',taskAr:'الْكُود',taskEn:'the code',verb:'k'},
  zaytuna:{id:'zaytuna',en:'Zaytuna',ar:'زَيْتُونَة',g:'f',color:'#0F6B4E',role:'Screen designer',taskAr:'الشَّاشَة',taskEn:'the screen',verb:'a'},
  sandra:{id:'sandra',en:'Sandra',ar:'سَانْدْرَا',g:'f',color:'#8a4fa3',role:'Plan leader',taskAr:'الْخُطَّة',taskEn:'the plan',verb:'k'}
};
const ORDER=['zaytuna','sandra','andy','ali'];

/* LINES: v = X (model voice: boy for male player, girl for female) | M (Muhammad) | L (Layla) | B / G (fixed boy / girl) */
const LINES={
 // vocabulary
 w_today:{ar:'الْيَوْم',en:'today',v:'X'},

/* ---------- audio ---------- */
function fileFor(id){
  const L=LINES[id];if(!L)return null;
  const n=L.v==='X'?(G()==='f'?'g_':'b_')+id:L.v==='B'?'b_'+id:L.v==='G'?'g_'+id:id;
  return (window.AUDIO&&window.AUDIO[n])||n+'.mp3';
}
let curAudio=null;
function stopAudio(){if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}try{speechSynthesis.cancel()}catch(e){}}
function play(id){
  return new Promise(res=>{
    stopAudio();
    const f=fileFor(id);if(!f){res();return}
    const a=new Audio(f);curAudio=a;let done=false;
    const fin=()=>{if(!done){done=true;res()}};
    a.onended=fin;
    a.onerror=()=>{ttsFallback(id).then(fin)};
    a.play().catch(()=>{ if(!done && a.error){} });
    setTimeout(fin,15000);
  });
}
function ttsFallback(id){
  return new Promise(res=>{
    try{
      const L=LINES[id];
      if(!('speechSynthesis' in window)){toast('Audio coming soon');res();return}
      const u=new SpeechSynthesisUtterance(L.ar.replace(/[ً-ْ]/g,''));
      u.lang='ar-SA';u.rate=.85;
      const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.startsWith('ar'));
      if(!vs.length){toast('Audio for this line is coming soon');res();return}
      u.voice=vs[0];u.onend=res;u.onerror=res;speechSynthesis.speak(u);setTimeout(res,8000);
    }catch(e){res()}
  });
}
async function playSeq(ids){for(const id of ids){await play(id);await wait(250)}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- sfx ---------- */
let AC=null;
function sfx(type){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const notes={good:[660,880],bad:[220,170],tap:[520],win:[523,659,784,1046],flip:[440]}[type]||[440];
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,AC.currentTime+i*.1);
      g.gain.exponentialRampToValueAtTime(type==='bad'?.08:.18,AC.currentTime+i*.1+.02);
      g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+i*.1+.22);
      o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+i*.1);o.stop(AC.currentTime+i*.1+.25);
    });
  }catch(e){}
}

/* ---------- confetti ---------- */
function confetti(){
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#C29A46','#0F6B4E','#BC7A34','#2f6fb5','#F2ECDE','#c2453a'];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,c:pick(cols),vy:2+Math.random()*4,vx:-2+Math.random()*4,a:Math.random()*6}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});if(++t<170)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}

/* ---------- recorder ---------- */
const RECS={};let mediaRec=null,recKey=null;
async function toggleRec(key,btn){
  if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[];mediaRec=new MediaRecorder(stream);recKey=key;
    mediaRec.ondataavailable=e=>chunks.push(e.data);
    mediaRec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());RECS[key]=URL.createObjectURL(new Blob(chunks,{type:mediaRec.mimeType||'audio/webm'}));btn.classList.remove('on');btn.innerHTML='&#127908; Again';const cmp=btn.parentElement.querySelector('[data-a="cmp"]');if(cmp)cmp.disabled=false;toast('Saved! Press &#9654; Compare')};
    mediaRec.start();btn.classList.add('on');btn.innerHTML='&#9632; Stop';
    setTimeout(()=>{if(mediaRec&&mediaRec.state==='recording'&&recKey===key)mediaRec.stop()},7000);
  }catch(e){toast('The microphone is blocked in this preview. Open the game from your class link (your website) to record. For now: listen, then say it out loud 3 times!',5000)}
}
async function compare(key){
  await play(key);await wait(300);
  if(RECS[key]){const a=new Audio(RECS[key]);curAudio=a;a.play().catch(()=>{})}
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NAMES=['علي','اندي','زيتونه','ساندرا','محمد','ليلي'];
function normAr(t){return (t||'').replace(/(100|١٠٠)\s*(%|٪)?/g,' مئة بالمئة ').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^\u0621-\u064A\s]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const SYN=[['غدا','بكره','بكرا','باكر']];
function wordMatch(w,h){if(h===w)return true;
  if(SYN.some(g=>g.includes(w)&&g.includes(h)))return true;
  // the future prefix is the lesson: never forgive a missing or extra س
  const fut=x=>/^(س|وس)[اتين]/.test(x);if(fut(w)!==fut(h))return false;
  const strip=x=>x.replace(/^(و|ال|وال)/,'');if(strip(h)===strip(w)&&strip(w).length>=2)return true;
  if(w.length>=4&&lev(h,w)<=1)return true;if(w.length>=6&&lev(h,w)<=2)return true;return false}
function scoreSpeech(target,heard){
  const orig=target.split(/\s+/).filter(x=>normAr(x));
  const H=normAr(heard).split(' ').filter(Boolean);const used=H.map(()=>false);
  const hits=orig.map(o=>{const w=normAr(o);if(NAMES.includes(w)||w==='يا')return true;
    const i=H.findIndex((h,k)=>!used[k]&&wordMatch(w,h));if(i>=0){used[i]=true;return true}return false});
  return {orig,hits,pct:Math.round(hits.filter(Boolean).length/Math.max(orig.length,1)*100)};
}
let recog=null;
function checkSpeech(id,btn){
  const L=LINES[id];if(!L)return;
  if(!SR){toast('Speech check works in Chrome, Edge or Safari. You can still Record and Compare.',3500);return}
  if(recog){try{recog.abort()}catch(e){}recog=null}
  stopAudio();
  const r=new SR();recog=r;r.lang='ar-SA';r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
  const old=btn.innerHTML;btn.classList.add('on');btn.innerHTML='&#127908; Listening… speak now';
  let got=false;
  r.onresult=e=>{got=true;const alts=[...e.results[0]].map(a=>a.transcript);
    let best=null,bestT='';alts.forEach(t=>{const sc=scoreSpeech(L.ar,t);if(!best||sc.pct>best.pct){best=sc;bestT=t}});
    showCheck(btn,best,bestT,id)};
  r.onerror=e=>{toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'The microphone is blocked here. Open the game from your class link (your website) and allow the microphone to use Check me.':e.error==='no-speech'?'I didn\'t hear anything — try again, a little louder.':'Speech check could not run here ('+e.error+'). Record & Compare still works.',3500)};
  r.onend=()=>{btn.classList.remove('on');btn.innerHTML=old;recog=null;if(!got)return};
  try{r.start()}catch(e){btn.classList.remove('on');btn.innerHTML=old}
}
function showCheck(btn,sc,heard,id){
  const host=btn.closest('.speak');let box=host.nextElementSibling;
  if(!box||!box.classList.contains('chk')){box=document.createElement('div');box.className='chk';host.insertAdjacentElement('afterend',box)}
  const lvl=sc.pct>=80?'ok':sc.pct>=50?'mid':'no';
  const msg=lvl==='ok'?pick(['Excellent pronunciation!','Muhammad is impressed!','Native-level confidence!','Clear and correct!']):lvl==='mid'?'Close! Listen again to the red words and repeat.':'Not yet. Press 🔊 Listen, then try again slowly.';
  if(lvl==='ok'){sfx('good');hit(id)}else{sfx('bad');miss(id)}
  box.className='chk '+lvl;
  box.innerHTML=`<div class="chk-top"><b>${sc.pct}%</b> ${msg}</div>
    <div class="ar chk-words">${sc.orig.map((w,i)=>`<span class="${sc.hits[i]?'w-ok':'w-no'}">${w}</span>`).join(' ')}</div>
    ${sc.orig.some((w,i)=>!sc.hits[i]&&/^(س|وس)[اتين]/.test(normAr(w)))?`<div><b>Tip:</b> start the red verb with the ${ar('سَـ')} magnet — that's what makes it future!</div>`:''}
    <div class="note">I heard: <span class="ar">${heard||'—'}</span></div>`;
}

let LV=null; // {n, mistakes}
function startLevel(n){
  stopAudio();LV={n,mistakes:0};const L=LEVELS[n-1];
  setTop(`Level ${n}: ${L.title}`);
  explainScreen(n,()=>RUN[L.key]());
}
function finishLevel(extraHtml=''){
  const n=LV.n;const m=LV.mistakes;
  const stars=m<=1?3:m<=4?2:1;
  const pr=prog();if(!TEACHER){pr.stars[n]=Math.max(pr.stars[n]||0,stars);save()}setTop(`Level ${n} complete`);
  sfx('win');confetti();
  const next=LEVELS[n];
  stage.innerHTML=`<div class="card center">
    <div class="eyebrow">Level ${n} complete</div>
    <div class="bigstars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <h2 class="h2">${['','Good start.','Strong work.','Flawless!'][stars]} ${m?`(${m} slip${m>1?'s':''} — they'll come back in the boss level)`:''}</h2>
    ${extraHtml}
    ${phraseBox(gx('m_goodM','m_goodF'),' &middot; Muhammad')}
    ${joke(n+3)}
    <div class="row" style="justify-content:center;margin-top:16px">
      <button class="btn ghost" id="again">Play again</button>
      ${next?`<button class="btn big" id="nxt">Next: ${next.title}</button>`:`<button class="btn big" id="nxt">Back to map</button>`}

}

/* ---------- generic multiple-choice quiz with second-chance queue ---------- */
function quiz(qs,{title='',onDone,timer=0,hearts=0,label=''}){
  let queue=qs.map(q=>({...q})),i=0,lives=hearts,tm=null;
  const total=()=>queue.length;
  function render(){
    if(i>=queue.length){onDone&&onDone({lives});return}
    const q=queue[i];setSkip(()=>{clearTimeout(tm);i++;render()},()=>{clearTimeout(tm);onDone&&onDone({lives})});
    const opts=q.noShuffle?q.options:shuffle(q.options);
    stage.innerHTML=`<div class="card">
      <div class="qhead"><div class="pbar"><i style="width:${(i/total())*100}%"></i></div><div class="qcount">${label||title} &middot; ${i+1}/${total()}</div>${hearts?`<div class="hearts">${'♥'.repeat(Math.max(lives,0))}${'♡'.repeat(Math.max(hearts-lives,0))}</div>`:''}</div>
      ${timer?'<div class="timer"><i id="tbar"></i></div>':''}
      ${q.retry?'<span class="second">Second chance</span>':''}
      <div class="prompt">${q.prompt}${q.audio?` <button class="sbtn" id="rep">&#128266; Play again</button>`:''}</div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}" data-ok="${o.correct?1:0}">${o.html}</button>`).join('')}</div>
      <div id="fbx"></div></div>`;
    if(q.audio){const pl=()=>Array.isArray(q.audio)?playSeq(q.audio):play(q.audio);setTimeout(pl,250);$('#rep').onclick=pl}
    let answered=false;
    if(timer){const bar=$('#tbar');bar.style.transition=`width ${timer}s linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width='0%'));tm=setTimeout(()=>{if(!answered)choose(null)},timer*1000)}
    function choose(btn){
      if(answered)return;answered=true;clearTimeout(tm);
      const o=btn?opts[+btn.dataset.k]:null;const ok=o&&o.correct;
      stage.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(opts[+b.dataset.k].correct)b.classList.add('right')});
      if(btn&&!ok)btn.classList.add('wrong');
      const right=opts.find(x=>x.correct);
      if(ok){sfx('good');hit(q.key)}else{sfx('bad');LV&&LV.mistakes++;miss(q.key);if(hearts)lives--;
        if(!q.retry&&!q.noRetry){const c={...q,retry:true};queue.splice(Math.min(i+3,queue.length),0,c)}}
      const whyWrong=o&&!ok&&o.why?`<div class="why">&#10007; ${o.why}</div>`:(!o?'<div class="why">Time\'s up! Here is the answer.</div>':'');
      const whyRight=`<div class="why">&#10003; ${right.why||q.why||''}</div>`;
      $('#fbx').innerHTML=`<div class="fb ${ok?'ok':'no'}"><div class="fbt">${ok?pick(['Exactly!','Spot on!','Yes!','Perfect!','Nailed it!']):'Not quite — look why:'}</div>${whyWrong}${whyRight}
        ${q.say?`<div><b>Now say it:</b> ${phraseBox(q.say)}</div>`:''}
        <div class="row" style="justify-content:flex-end"><button class="btn" id="nx">${hearts&&lives<=0?'Continue':'Next'}</button></div></div>`;
      if(q.say&&ok)setTimeout(()=>play(q.say),400);
      $('#nx').onclick=()=>{stopAudio();i++;if(hearts&&lives<=0){onDone&&onDone({lives:0,failed:true});return}render()};
      $('#fbx').scrollIntoView({behavior:'smooth',block:'nearest'});
    }
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b));
  }
  render();
}
const A=(t,correct,why)=>({html:ar(t),correct:!!correct,why});
const E=(t,correct,why)=>({html:t,correct:!!correct,why});

/* ---------- build-a-sentence ---------- */
function buildGame(rounds,onDone){
  let r=0;
  function render(){
    if(r>=rounds.length){onDone();return}
    const R=rounds[r];let built=[];window.__ANS=R.answer;setSkip(()=>{r++;render()},onDone);
    const tiles=shuffle([...R.answer,...(R.extra||[])]);
    stage.innerHTML=`<div class="card"><div class="qhead"><div class="pbar"><i style="width:${r/rounds.length*100}%"></i></div><div class="qcount">Build it &middot; ${r+1}/${rounds.length}</div></div>
      <p class="prompt">Build: <b>"${R.en}"</b>${TEACHER?` <span class="note">(answer: ${ar(R.answer.join(' '))})</span>`:''}<br><span class="note">Tap the pieces in order. Arabic runs right &#8592; left, so the first piece lands on the right.</span></p>
      <div class="buildrow" id="row"></div>
      <div class="chips" id="pool">${tiles.map((t,k)=>`<button class="tile" data-k="${k}" data-t="${t}">${ar(t)}</button>`).join('')}</div>
      <div class="row"><button class="btn ghost" id="undo">Undo</button><button class="btn" id="chk">Check</button></div><div id="fbx"></div></div>`;
    const row=$('#row');
    stage.querySelectorAll('#pool .tile').forEach(b=>b.onclick=()=>{sfx('tap');built.push(tiles[+b.dataset.k]);b.classList.add('used');b.style.visibility='hidden';b.dataset.used=1;row.insertAdjacentHTML('beforeend',`<span class="tile inrow">${ar(tiles[+b.dataset.k])}</span>`)});
    $('#undo').onclick=()=>{if(!built.length)return;const last=built.pop();row.lastElementChild.remove();const b=[...stage.querySelectorAll('#pool .tile')].reverse().find(x=>x.dataset.used&&tiles[+x.dataset.k]===last);if(b){b.style.visibility='';delete b.dataset.used}};
    $('#chk').onclick=()=>{
      const ok=built.join(' ')===R.answer.join(' ');
      if(ok){sfx('good');hit(R.key);$('#fbx').innerHTML=`<div class="fb ok"><div class="fbt">Perfect sentence!</div><div class="why">&#10003; ${R.why}</div><div><b>Now say it:</b> ${phraseBox(R.line)}</div><div class="row" style="justify-content:flex-end"><button class="btn" id="nx">Next</button></div></div>`;setTimeout(()=>play(R.line),300);$('#nx').onclick=()=>{r++;render()}}
      else{sfx('bad');LV.mistakes++;miss(R.key);row.classList.add('shake');setTimeout(()=>row.classList.remove('shake'),400);
        $('#fbx').innerHTML=`<div class="fb no"><div class="fbt">Almost. The right order is:</div><div class="phrase">${ar(R.answer.join(' '))}</div><div class="why">${R.hint}</div><div class="row" style="justify-content:flex-end"><button class="btn" id="retry">Try building it again</button></div></div>`;
        $('#retry').onclick=render}
    };
  }
  render();
}

/* ---------- memory match ---------- */
function memoryGame(pairs,onDone){setSkip(onDone);
  const cards=shuffle(pairs.flatMap((p,i)=>[{i,t:'ar',v:p.ar,line:p.line},{i,t:'en',v:p.en}]));
  let open=[],done=0,lock=false,tries=0;
  stage.innerHTML=`<div class="card"><div class="eyebrow">Memory Match</div><p class="prompt">Find each Arabic word and its English twin. Every Arabic card speaks when you flip it.</p><div class="mem">${cards.map((c,k)=>`<button class="mcard" data-k="${k}" data-pair="${c.i}">&#9670;</button>`).join('')}</div><div id="fbx"></div></div>`;
  stage.querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains('open')||b.classList.contains('gone'))return;
    const c=cards[+b.dataset.k];b.classList.add('open');b.innerHTML=c.t==='ar'?ar(c.v):`<span class="en">${c.v}</span>`;sfx('flip');if(c.t==='ar')play(c.line);
    open.push(b);
    if(open.length===2){lock=true;tries++;const [x,y]=open.map(o=>cards[+o.dataset.k]);
      if(x.i===y.i&&x.t!==y.t){setTimeout(()=>{open.forEach(o=>{o.classList.remove('open');o.classList.add('gone')});sfx('good');open=[];lock=false;done++;
        if(done===pairs.length){if(tries>pairs.length+4)LV.mistakes+=1;$('#fbx').innerHTML=`<div class="fb ok"><div class="fbt">All pairs found in ${tries} tries!</div><div class="row" style="justify-content:flex-end"><button class="btn" id="nx">Next</button></div></div>`;$('#nx').onclick=onDone}},450)}
      else{setTimeout(()=>{open.forEach(o=>{o.classList.remove('open');o.innerHTML='&#9670;'});open=[];lock=false},1000)}}
  });
}

   {q:['m_succeedQ'],opts:[[LINES.p_vow.ar,25,`${ar('سَنَنْجَح')} + ${ar('هَذَا وَعْد!')} — the strongest close.`],['لَا أَعْرِف.',-20,'"I don\'t know." The meter just fainted.'],['نَجَاح.',0,'One word: "success". True, but where is your promise?']]}
  ];
  function render(){
   if(turn>=T.length){end();return}
   const t=T[turn];const opts=shuffle(t.opts);setSkip(()=>{turn++;render()},()=>{conf=Math.max(conf,70);turn=T.length;render()});
   stage.innerHTML=`<div class="card"><div class="eyebrow">Confidence meter &middot; turn ${turn+1}/${T.length}</div>
     <div class="meter"><i style="width:${conf}%"></i><span>Muhammad's confidence: ${conf}%</span></div>
     <div class="explain" style="margin-top:14px"><div class="who">${svgMuhammad()}</div><div>
     <div class="bubble"><span class="who-n" style="color:var(--ink)">Muhammad</span>${ar(t.q.map(id=>LINES[id].ar).join(' '))}<br><span class="note">${t.q.map(id=>LINES[id].en).join(' ')}</span> <button class="sbtn" id="rep">&#128266;</button></div>
     <div class="opts" style="grid-template-columns:1fr;margin-top:12px">${opts.map((o,k)=>`<button class="opt" data-k="${k}" data-ok="${o[1]===Math.max(...t.opts.map(x=>x[1]))?1:0}">${ar(o[0])}</button>`).join('')}</div><div id="fbx"></div></div></div></div>`;
   const pl=()=>playSeq(t.q);setTimeout(pl,300);$('#rep').onclick=pl;let done=false;
   stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=true;const o=opts[+b.dataset.k];const best=Math.max(...t.opts.map(x=>x[1]));
     conf=Math.max(0,Math.min(100,conf+o[1]));const ok=o[1]===best;
     if(ok)sfx('good');else{sfx('bad');LV.mistakes++;miss('meter'+turn)}
     stage.querySelector('.meter i').style.width=conf+'%';stage.querySelector('.meter span').textContent=`Muhammad's confidence: ${conf}%`;
     b.classList.add(ok?'right':'wrong');const bestO=t.opts.find(x=>x[1]===best);
     $('#fbx').innerHTML=`<div class="fb ${ok?'ok':'no'}"><div class="fbt">${o[1]>0?'+':''}${o[1]}% &middot; ${ok?'Great answer':'Better answer below'}</div><div class="why">${o[2]}</div>${ok?'':`<div class="why">&#10003; Best: ${ar(bestO[0])} — ${bestO[2]}</div>`}<div class="row" style="justify-content:flex-end"><button class="btn" id="nx">Next</button></div></div>`;
     $('#nx').onclick=()=>{turn++;render()}});
  }
  function end(){
   if(conf>=70){finishLevel(`<p class="muted">Muhammad's confidence: <b>${conf}%</b>. Timeline approved!</p>`)}
   else{stage.innerHTML=`<div class="card center"><div class="eyebrow">Meeting over</div><h2 class="h2">Confidence: ${conf}% — Muhammad wants another round.</h2><p class="muted">You need 70%. Every answer showed you why — try again, you know it now.</p>${phraseBox(gx('l_noFearM','l_noFearF'),' &middot; Layla')}<button class="btn big" id="again">Try the meeting again</button></div>`;setTimeout(()=>play(gx('l_noFearM','l_noFearF')),400);$('#again').onclick=()=>{LV.mistakes=0;conf=50;turn=0;render()}}
  }
  render();
 },

 /* ---------- L8 boss ---------- */
 boss(){
  const bank=bossBank();
  const missed=prog().missed;
  const weighted=bank.map(q=>({q,w:(missed[q.key]||0)*3+Math.random()*2})).sort((a,b)=>b.w-a.w).map(x=>x.q);
  const chosen=shuffle(weighted.slice(0,12));
  quiz(chosen,{label:'BOSS',timer:15,hearts:3,onDone:(r)=>{
    if(r.failed){stage.innerHTML=`<div class="card center"><div class="eyebrow">Out of hearts</div><h2 class="h2">The roadmap needs one more draft.</h2><p class="muted">The questions you missed are now at the top of the pile. Go again — they'll feel easier.</p>${phraseBox(gx('l_noFearM','l_noFearF'),' &middot; Layla')}<button class="btn big" id="again">Retry the boss</button></div>`;$('#again').onclick=()=>startLevel(8)}
    else finishLevel(`<p class="muted">Hearts left: ${'♥'.repeat(r.lives)}</p>`)}});
 },

 /* ---------- L9 roleplay ---------- */
 roleplay(){
  const tm=pick(others());
  const turns=[
   {q:['m_name_'+P.id,'m_when'],model:'p_notToday',tip:'Stall: not today, ready tomorrow.'},
   {q:[gx('m_whatM','m_whatF')],model:'t_'+P.id,tip:`Your task with ${ar('سَأَ')}.`},
   {q:['m_team'],model:'d_'+tm.id,tip:`Delegate to ${tm.en} (${tm.g==='f'?'she':'he'} will…).`},
   {q:['m_future'],model:'p_100',tip:`Use ${ar('رَاح')} for the big vision.`},
   {q:['m_succeedQ'],model:'p_vow',tip:'Promise it.'}
  ];let k=0;
  function render(){
   if(k>=turns.length){checklist();return}
   const t=turns[k];setSkip(()=>{k++;render()},()=>{k=turns.length;render()});
   stage.innerHTML=`<div class="card"><div class="qhead"><div class="pbar"><i style="width:${k/turns.length*100}%"></i></div><div class="qcount">Face Muhammad &middot; ${k+1}/${turns.length}</div></div>
    <div class="explain"><div class="who">${svgMuhammad()}</div><div>
     <div class="bubble"><span class="who-n" style="color:var(--ink)">Muhammad</span>${ar(t.q.map(id=>LINES[id].ar).join(' '))}<br><span class="note">${t.q.map(id=>LINES[id].en).join(' ')}</span> <button class="sbtn" id="rep">&#128266;</button></div>
     <p class="prompt" style="margin-top:12px">Your turn: answer <b>out loud</b>${MIC_OK?'':' (say it, then press “Show the model answer” to check yourself)'}. Hint: ${t.tip}</p>
     <div class="row"><span class="speak" data-line="${t.model}"><button class="sbtn rec" data-a="rec">&#127908; Record my answer</button><button class="sbtn chkbtn" data-a="chk">&#9989; Say it &amp; check me</button></span><button class="btn ghost" id="reveal">Show the model answer</button></div>
     <div id="mod" class="hidden">${phraseBox(t.model,' &middot; model answer')}<p class="note">Press &#9654; Compare: you'll hear the model first, then yourself.</p><div class="row" style="justify-content:flex-end"><button class="btn" id="nx">Next question</button></div></div>
    </div></div></div>`;
   const pl=()=>playSeq(t.q);setTimeout(pl,300);$('#rep').onclick=pl;
   $('#reveal').onclick=()=>{$('#mod').classList.remove('hidden');$('#reveal').classList.add('hidden');play(t.model)};
   $('#mod').addEventListener('click',e=>{if(e.target.id==='nx'){k++;render()}});
  }
  function checklist(){
   stage.innerHTML=`<div class="card"><div class="eyebrow">Self-check</div><h2 class="h2">Which tools did you use out loud?</h2>
    <div class="checklist">
     <label><input type="checkbox"> A time word: ${ar('غَدًا / بُكْرَة / الْأُسْبُوع الْقَادِم')}</label>
     <label><input type="checkbox"> The magnet ${ar('سَـ')}: ${ar('سَأَكْتُب')}…</label>
     <label><input type="checkbox"> The right person sticker for a teammate: ${ar('سَيَـ / سَتَـ')}</label>
     <label><input type="checkbox"> ${ar('رَاح')} with a plain verb: ${ar('رَاح نَنْجَح')}</label>
     <label><input type="checkbox"> The promise: ${ar('سَنَنْجَح. هَذَا وَعْد!')}</label></div>
    <div class="row" style="justify-content:flex-end"><button class="btn big" id="fin">Close the deal</button></div></div>`;
   $('#fin').onclick=()=>{const c=[...stage.querySelectorAll('input')].filter(x=>x.checked).length;LV.mistakes=Math.max(0,5-c);cert(c)};
  }
  function cert(c){
   const pr=prog();const stars=LV.mistakes<=1?3:LV.mistakes<=3?2:1;if(!TEACHER){pr.stars[9]=Math.max(pr.stars[9]||0,stars);save()}
   sfx('win');confetti();setTop('Deal closed');
   const d=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
   stage.innerHTML=`${sceneBox('deal',6)}<div class="spacer"></div><div class="cert">
     <div class="eyebrow">The Global Summit &middot; Episode 21</div>
     <h2 class="h1">Certificate of Future Projections</h2>
     <p class="ar">${P.ar}</p><p style="font-size:20px;font-weight:700;margin:0">${P.en}</p>
     <p class="muted">can set a deadline, assign tasks with ${ar('سَـ')}, speak the future with ${ar('سَوْف')} and ${ar('رَاح')}, and promise success in Arabic.</p>
     <div class="bigstars">★ ${totalStars()} / 27</div><p class="note">${d} &middot; signed: Muhammad, Head of the Summit</p></div>
     ${phraseBox('m_execute',' &middot; Muhammad')}
     <div class="card" style="margin-top:14px"><div class="eyebrow">Mission for home</div><h2 class="h2">Your WhatsApp commitment</h2>
     <p>Send a voice note to the cohort group, tag Layla, and say what you will do tomorrow:</p>
     ${phraseBox('t_'+P.id)}
     <p class="note">Then reply to the next person's voice note confirming <b>their</b> task with ${ar('سَيَـ / سَتَـ')}. Next episode: The Pitch Rehearsal.</p>
     <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="prt">&#128424; Print</button><button class="btn brass" id="dlc">&#11015; Download certificate</button><button class="btn" id="mapb">Back to map</button></div>
     <div id="certprev" class="hidden" style="margin-top:12px"><p class="note">Your certificate image (on a phone: press and hold it to save):</p><img id="certimg" alt="Certificate" style="width:100%;border-radius:12px;border:1px solid var(--line)"></div></div>`;
   mountVideos();setTimeout(()=>play('m_execute'),500);$('#mapb').onclick=showMap;
   const info={ar:P.ar,en:P.en,stars:totalStars(),date:d};
   $('#dlc').onclick=()=>saveCertificate(info);
   $('#prt').onclick=()=>printCertificate(info);
  }
  render();
 }
};

/* ---------- certificate image / print ---------- */
async function certCanvas(info){
  try{await Promise.all([document.fonts.load('700 80px "Noto Naskh Arabic"'),document.fonts.load('700 60px Spectral'),document.fonts.load('600 30px Inter')])}catch(e){}
  const W=2000,H=1414,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#0E1E22';x.fillRect(0,0,W,H);
  x.fillStyle='#FFFDF6';x.fillRect(50,50,W-100,H-100);
  x.strokeStyle='#C29A46';x.lineWidth=14;x.strokeRect(80,80,W-160,H-160);x.lineWidth=4;x.strokeRect(110,110,W-220,H-220);
  const ctr=(t,y,font,col,rtl)=>{x.font=font;x.fillStyle=col;x.textAlign='center';x.direction=rtl?'rtl':'ltr';x.fillText(t,W/2,y)};
  ctr('THE GLOBAL SUMMIT  ·  EPISODE 21',230,'700 30px Inter, Arial','#A57F2E');
  ctr('Certificate of Future Projections',350,'700 84px Spectral, Georgia, serif','#0E1E22');
  ctr('شَهَادَة',470,'700 76px "Noto Naskh Arabic", serif','#0F6B4E',true);
  ctr('This certifies that',570,'500 34px Inter, Arial','#5E6560');
  ctr(info.ar,720,'700 120px "Noto Naskh Arabic", serif','#182420',true);
  ctr(info.en,810,'700 54px Inter, Arial','#182420');
  ctr('can set a deadline, assign tasks, talk about the future',900,'500 36px Inter, Arial','#182420');
  ctr('and promise success in Arabic.',950,'500 36px Inter, Arial','#182420');
  ctr('سَنَنْجَح. هَذَا وَعْد!',1060,'700 64px "Noto Naskh Arabic", serif','#A57F2E',true);
  ctr('★ '+info.stars+' / 27 stars',1140,'700 40px Inter, Arial','#C29A46');
  x.strokeStyle='#182420';x.lineWidth=2;x.beginPath();x.moveTo(330,1250);x.lineTo(830,1250);x.moveTo(W-830,1250);x.lineTo(W-330,1250);x.stroke();
  x.font='500 28px Inter, Arial';x.fillStyle='#5E6560';x.textAlign='center';x.direction='ltr';
  x.fillText('Muhammad, Head of the Summit',580,1295);x.fillText(info.date,W-580,1295);
  return c;
}
async function saveCertificate(info){
  const btn=$('#dlc');if(btn){btn.disabled=true;btn.textContent='Preparing…'}
  try{
    const c=await certCanvas(info);
    const url=c.toDataURL('image/png');$('#certimg').src=url;$('#certprev').classList.remove('hidden');
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    const name='Certificate_Future_Projections_'+info.en+'.png';
    let done=false;
    try{if(window.claude&&typeof window.claude.use==='function'){
      const dl=await Promise.race([window.claude.use('downloads'),wait(4000).then(()=>null)]);
      if(dl){try{await dl.save({filename:name,data:blob});done=true;toast('Certificate saved!')}catch(e){if(e&&e.code==='declined'){done=true}}}
    }}catch(e){}
    if(!done){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Certificate downloaded. You can also press and hold the image below to save it.',4000)}
  }catch(e){toast('Could not create the image here. Take a screenshot of the certificate instead.')}
  if(btn){btn.disabled=false;btn.innerHTML='&#11015; Download certificate'}
}
function printCertificate(info){
  let printed=false;const mark=()=>{printed=true};window.addEventListener('beforeprint',mark,{once:true});
  document.body.classList.add('printing-cert');
  try{window.print()}catch(e){}
  setTimeout(()=>{document.body.classList.remove('printing-cert');window.removeEventListener('beforeprint',mark);
    if(!printed){toast('Printing is blocked in this preview — downloading the certificate instead.',4000);saveCertificate(info)}},1200);
}

/* ---------- boss bank ---------- */
function bossBank(){
  const tm=others();
  const b=[];
  const time=['w_today','w_now','w_ghadan','w_bukra','w_nextweek','w_future','w_plan','w_ready','w_success','w_promise','w_mumtaz','w_sawfa','w_rah','w_a3iduka','w_sananjah'];
  time.forEach(id=>{const d=shuffle(time.filter(k=>k!==id&&LINES[k].en!==LINES[id].en&&!(['w_ghadan','w_bukra'].includes(id)&&['w_ghadan','w_bukra'].includes(k)))).slice(0,3);
    b.push({key:id,prompt:`Hear it. Pick the meaning.`,audio:id,options:[E(LINES[id].en,1,`${ar(LINES[id].ar)} = ${LINES[id].en}.`),...d.map(k=>E(LINES[k].en,0,`That's ${ar(LINES[k].ar)}.`))]});
    b.push({key:id,prompt:`Which Arabic means <b>"${LINES[id].en}"</b>?`,options:[A(LINES[id].ar,1,`${ar(LINES[id].ar)} = ${LINES[id].en}.`),...d.map(k=>A(LINES[k].ar,0,`${ar(LINES[k].ar)} = ${LINES[k].en}.`))]});
  });
  [['v_saaktub',"I'll write",'أَكْتُب','سَكْتُب'],['v_saa3mal',"I'll work",'أَعْمَل','أَسَعْمَل'],['v_saadhhab',"I'll go",'أَذْهَب','سَذْهَب']].forEach(([id,en,p,w])=>b.push({key:id,prompt:`<b>"${en}"</b>`,options:[A(LINES[id].ar,1,`${ar('سَـ')} + ${ar('أَ')} + verb.`),A(p,0,'Present — no future magnet.'),A(w,0,'The magnet must sit at the front and the أَ must stay.')]}));
  tm.forEach(t=>{const she=t.g==='f';b.push({key:'d_'+t.id,prompt:`<b>"${t.en} will ${verbEn(t)} ${t.taskEn}."</b>`,options:[A(LINES['d_'+t.id].ar,1,`${t.en} = ${she?'she':'he'} &#8594; ${ar(she?'سَتَـ':'سَيَـ')}.`),A(t.ar+' '+verbFor(t,she?'he':'she')+' '+objFor(t),0,`Wrong sticker: ${t.en} is ${she?'she':'he'}.`),A(verbFor(t,'I')+' '+objFor(t),0,`${ar('أَ')} = I.`)]})});
  b.push({key:'w_rah',prompt:'Which is <b>correct</b>?',options:[A('رَاح نَكْتُب',1,`${ar('رَاح')} + plain verb.`),A('رَاح سَنَكْتُب',0,'Double will.'),A('سَرَاح نَكْتُب',0,'Double will, glued.')]});
  b.push({key:'w_sawfa',prompt:'Formal meeting. Choose the <b>suit</b> sentence.',options:[A(LINES.p_meeting.ar,1,`${ar('سَوْف')} = formal will.`),A(LINES.p_rahWork.ar,0,`${ar('رَاح')} + ${ar('بُكْرَة')} = slippers.`)]});
  b.push({key:'t_'+P.id,prompt:`Muhammad asks you: ${ar(gx(LINES.m_whatM.ar,LINES.m_whatF.ar))}`,audio:gx('m_whatM','m_whatF'),options:[A(LINES['t_'+P.id].ar,1,'Your task, with أَ = I.'),A(LINES['d_'+P.id].ar,0,'That is someone talking about you.')]});
  b.push({key:'w_a3iduka',prompt:'Promise Muhammad:',options:[A('أَعِدَك يَا مُحَمَّد',1,'-ak = to a man (a\'idak).'),A('أَعِدِك يَا مُحَمَّد',0,'-ik (a\'idik) is for a woman.')]});
  b.push({key:'m_whatF',prompt:'Ask <b>Zaytuna</b> what she will do tomorrow:',options:[A('مَاذَا سَتَعْمَلِين غَدًا؟',1,'To a woman: -een.'),A('مَاذَا سَتَعْمَل غَدًا؟',0,'That is for a man.')]});
  b.push({key:'w_mumtaz',prompt:'"The plan is excellent."',options:[A('الْخُطَّة مُمْتَازَة',1,'ـة noun &#8594; ـة adjective.'),A('الْخُطَّة مُمْتَاز',0,'Missing ـة on excellent.')]});
  return b;
}

window.__GAME__={PLAYERS,LINES,LEVELS,RUN,startLevel,setPlayer:id=>{P=PLAYERS[id]},prog,fileFor};
