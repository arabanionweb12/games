<!doctype html>
<html lang="en"><head>
<title>Souq Wast al-Balad</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#3AB8FF;--sun:#FFD23F;--pink:#FF4D8D;--lime:#7BD23A;--grape:#7B4DFF;--ink:#1B1740;--orange:#FF8A3D;
  --bg1:#FFF4D6;--bg2:#FFE1B3;--card:#FFFFFF;--text:#1B1740;--muted:#5B5680;--line:#1B1740;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg1:#241E4A;--bg2:#15112E;--card:#2E2760;--text:#FFF7E8;--muted:#C9C3F0;--line:#0B0820}
}
:root[data-theme="dark"]{--bg1:#241E4A;--bg2:#15112E;--card:#2E2760;--text:#FFF7E8;--muted:#C9C3F0;--line:#0B0820}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 20% 0%,var(--bg1),var(--bg2));color:var(--text);font-family:'Baloo 2',system-ui,sans-serif;overflow-x:hidden}
.ar,[dir=rtl]{font-family:'Noto Naskh Arabic','Baloo 2',serif}
bdi.ar{unicode-bidi:isolate}
button{font-family:inherit;cursor:pointer;border:none}
#app{max-width:980px;margin:0 auto;padding:14px 16px 90px;position:relative}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.pill{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:800;box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;gap:6px}
.btn{background:var(--sun);color:#1B1740;border:3px solid var(--line);border-radius:18px;padding:10px 20px;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.pink{background:var(--pink);color:#fff}.btn.sky{background:var(--sky);color:#fff}.btn.lime{background:var(--lime)}.btn.grape{background:var(--grape);color:#fff}.btn.ghost{background:var(--card);color:var(--text)}
.btn[disabled]{opacity:.35;pointer-events:none}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;box-shadow:0 7px 0 var(--line);padding:18px;margin:12px 0}
h1{font-size:clamp(34px,7vw,64px);line-height:1;margin:6px 0}
h2{font-size:clamp(24px,4.5vw,36px);margin:4px 0}
.big-ar{font-family:'Noto Naskh Arabic',serif;font-size:clamp(28px,5.5vw,46px);font-weight:700;direction:rtl}
.hint{color:var(--muted);font-size:16px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
/* awning */
.awning{height:44px;border:3px solid var(--line);border-radius:18px 18px 0 0;background:repeating-linear-gradient(90deg,#FF4D8D 0 44px,#FFF 44px 88px);position:relative}
.awning:after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;background:radial-gradient(circle at 22px 0,#FF4D8D 20px,transparent 21px) 0 0/88px 18px,radial-gradient(circle at 66px 0,#fff 20px,transparent 21px) 0 0/88px 18px}
/* player cards */
.pcard{cursor:pointer;text-align:center;transition:transform .15s}
.pcard:hover{transform:translateY(-4px) rotate(-1deg)}
.pcard .face{font-size:64px;line-height:1}
.pcard .nm{font-family:'Noto Naskh Arabic';font-size:34px;font-weight:700}
.tag{display:inline-block;border:2px solid var(--line);border-radius:10px;padding:0 8px;font-size:14px;font-weight:800;background:var(--sun);color:#1B1740}
/* map */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stop{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px 8px;text-align:center;box-shadow:0 5px 0 var(--line);cursor:pointer;position:relative}
.stop .ic{font-size:40px}
.stop .t{font-family:'Noto Naskh Arabic';font-weight:700;font-size:20px}
.stop .e{font-size:13px;color:var(--muted)}
.stop.locked{filter:grayscale(1);opacity:.45;cursor:not-allowed}
.stop.done:after{content:"✔";position:absolute;top:-10px;right:-8px;background:var(--lime);border:3px solid var(--line);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:800}
.stop.next{animation:bob 1.2s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
/* items */
.item{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:10px;text-align:center;cursor:pointer;box-shadow:0 5px 0 var(--line);position:relative}
.item .ic{font-size:52px;height:64px;display:grid;place-items:center}
.item .ic svg{width:60px;height:60px}
.item .nm{font-family:'Noto Naskh Arabic';font-size:22px;font-weight:700;direction:rtl}
.item.mine{background:linear-gradient(#FFF8D1,#FFE68A);color:#1B1740}
.item.mine:before{content:"📝";position:absolute;top:-12px;left:-8px;font-size:24px}
.item.heard{outline:4px dashed var(--lime);outline-offset:3px}
.phrase{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 10px;box-shadow:0 4px 0 var(--line)}
.phrase .txt{flex:1;direction:rtl;text-align:right;font-family:'Noto Naskh Arabic';font-size:22px;font-weight:700}
.phrase .en{display:block;font-family:'Baloo 2';font-size:13px;color:var(--muted);font-weight:500;direction:ltr;text-align:right}
.ib{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--sky);color:#fff;font-size:20px;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--line)}
.ib.rec{background:var(--pink)}.ib.rec.on{animation:pulse .6s infinite}.ib.play{background:var(--lime)}
@keyframes pulse{50%{transform:scale(1.15)}}
/* seller stage */
.stage{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center}
@media (max-width:640px){.stage{grid-template-columns:110px 1fr}}
.seller svg{width:100%;height:auto}
.bubble{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px 16px;position:relative;min-height:64px;box-shadow:0 5px 0 var(--line)}
.bubble:before{content:"";position:absolute;left:-16px;top:24px;border:12px solid transparent;border-right-color:var(--line)}
.bubble .ar{font-size:clamp(22px,4vw,32px);font-weight:700;direction:rtl;display:block;text-align:right}
.me{background:linear-gradient(#DDF4FF,#BDE8FF);color:#1B1740}
.mouth{transition:transform .1s}
.talking .mouth{animation:talk .22s infinite}
@keyframes talk{50%{transform:scaleY(.25)}}
/* options */
.opt{background:var(--card);color:var(--text);border:3px solid var(--line);border-radius:18px;padding:12px;font-size:22px;font-weight:700;box-shadow:0 5px 0 var(--line);font-family:'Noto Naskh Arabic','Baloo 2';direction:rtl;min-height:64px}
.opt.num{font-family:'Baloo 2';font-size:34px;direction:ltr}
.opt.good{background:var(--lime);color:#1B1740;animation:pop .3s}
.opt.bad{background:#FFB3B3;color:#1B1740;animation:shake .35s}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* price tag + meter */
.ptag{display:inline-block;background:var(--sun);color:#1B1740;border:4px solid var(--line);border-radius:14px 30px 30px 14px;padding:4px 26px 4px 18px;font-size:clamp(40px,8vw,64px);font-weight:800;box-shadow:0 6px 0 var(--line);position:relative}
.ptag:after{content:"";position:absolute;right:10px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--bg2);border:3px solid var(--line)}
.ptag small{font-size:20px}
.meter{height:26px;border:3px solid var(--line);border-radius:999px;background:linear-gradient(90deg,var(--lime),var(--sun),var(--pink));position:relative;margin:14px 0 4px}
.meter .dot{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-size:16px;transition:left .5s cubic-bezier(.3,1.5,.5,1)}
.meter .fair{position:absolute;top:-8px;bottom:-8px;width:4px;background:var(--line)}
.moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.move{background:var(--card);color:var(--text);border:3px solid var(--line);border-radius:16px;padding:8px 10px;box-shadow:0 4px 0 var(--line);text-align:right;direction:rtl}
.move b{font-family:'Noto Naskh Arabic';font-size:21px;display:block}
.move span{font-size:13px;color:var(--muted);direction:ltr;display:block;text-align:right}
.move.rude{background:#FFE0E0;color:#1B1740}
.move.deal{background:var(--lime);color:#1B1740}
.move.used{opacity:.45}
.wallet{font-weight:800;font-size:22px}
.stars{font-size:28px;letter-spacing:2px}
.namebox{min-height:84px;border:4px dashed var(--line);border-radius:20px;display:flex;align-items:center;justify-content:center;font-family:'Noto Naskh Arabic';font-size:clamp(38px,8vw,60px);font-weight:700;direction:rtl;background:var(--bg1);margin-bottom:14px}
.namebox .ph{color:var(--muted);font-size:26px}
.caret{display:inline-block;width:4px;height:52px;background:var(--pink);margin-right:4px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;direction:rtl}
.key{background:var(--card);color:var(--text);border:3px solid var(--line);border-radius:14px;font-family:'Noto Naskh Arabic';font-size:28px;font-weight:700;height:56px;box-shadow:0 4px 0 var(--line)}
.key:nth-child(4n+1){background:#FFF3B0;color:#1B1740}.key:nth-child(4n+2){background:#D6F0FF;color:#1B1740}.key:nth-child(4n+3){background:#FFD9E6;color:#1B1740}.key:nth-child(4n){background:#DDF5C8;color:#1B1740}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.wide{grid-column:span 2;font-size:20px;background:var(--sun)!important}.key.back{background:var(--pink)!important;color:#fff!important}
.note{--nc:#2E9E6A;width:120px;height:64px;border-radius:10px;border:3px solid var(--line);background:linear-gradient(135deg,var(--nc),color-mix(in srgb,var(--nc) 60%,#fff));color:#fff;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--line);margin:4px;position:relative}
.note:before{content:"";position:absolute;inset:6px;border:2px dashed rgba(255,255,255,.6);border-radius:6px}
.note .nv{font-size:28px;font-weight:800;line-height:1}.note .nd{font-family:'Noto Naskh Arabic';font-size:14px}
.note.sm{width:70px;height:40px;margin:-6px 2px}.note.sm .nv{font-size:18px}
.counter{min-height:110px;border:3px solid var(--line);border-radius:18px;background:repeating-linear-gradient(90deg,#C98B4E 0 30px,#B97A3F 30px 60px);margin:14px 0;padding:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px}
.counter .hint{color:#fff}
.tv{position:relative;border:4px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 7px 0 var(--line);margin:12px 0;background:#000;aspect-ratio:16/9}
.tv video{width:100%;height:100%;object-fit:cover;display:block}
.tvcap{position:absolute;left:12px;bottom:12px;right:12px;text-align:right;direction:rtl;font-family:'Noto Naskh Arabic';font-weight:700;font-size:clamp(20px,3.6vw,30px);color:#fff;text-shadow:0 2px 6px #000,0 0 2px #000}
.ov .tv{margin:6px 0 10px}
.tvbtn{position:absolute;top:12px;left:12px;z-index:2;background:var(--sun);color:#1B1740;border:3px solid var(--line);border-radius:999px;padding:6px 16px;font-size:22px;font-weight:800;box-shadow:0 4px 0 var(--line);display:flex;gap:8px;align-items:center;animation:pulse 1.4s infinite}
.tvbtn .ar{font-size:20px}
.taphint{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:80;background:var(--pink);color:#fff;border:3px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:800;box-shadow:0 4px 0 var(--line);animation:pulse 1.2s infinite;max-width:calc(100% - 24px);text-align:center}
.gapbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:65;background:#FFF8D1;color:#1B1740;border:4px solid var(--line);border-radius:22px;box-shadow:0 7px 0 var(--line);padding:12px 18px;width:min(520px,calc(100% - 24px));text-align:center;animation:slidein .35s}
.gapbar .gtop{font-size:20px;margin-bottom:4px}.gapbar .gtop .ar{font-size:22px;font-weight:700}
.gapbar .gtxt{font-size:30px;font-weight:700;direction:rtl;margin:4px 0 10px}
.gapbar .btn{font-size:18px;padding:8px 18px}
.gapbar #gapNext{opacity:.55}.gapbar #gapNext.ready{opacity:1;animation:pulse 1.2s infinite}
.hear{cursor:pointer}
.hear:not(.inbtn)::after{content:"🔊";font-size:.45em;opacity:.6;margin-inline-start:5px;vertical-align:super;font-family:sans-serif}
.hear:not(.inbtn):hover{text-decoration:underline dotted 2px}
.spk{font-style:normal;font-size:15px;line-height:1;margin-inline-start:6px;background:#fff;color:#1B1740;border:2px solid #1B1740;border-radius:50%;padding:3px;cursor:pointer;display:inline-block;vertical-align:middle}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(27,23,64,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.show{display:flex}
.ov .card{max-width:620px;max-height:92vh;overflow:auto;width:100%;text-align:center;animation:pop .35s}
.codebox{font-size:34px;letter-spacing:10px;text-align:center;width:200px;border:3px solid var(--line);border-radius:14px;padding:6px;font-family:'Baloo 2';font-weight:800}
/* joke */
#joke{position:fixed;left:12px;bottom:12px;max-width:min(420px,calc(100% - 24px));z-index:40;display:none}
#joke.show{display:block;animation:slidein .4s}
#joke .card{margin:0;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;background:#FFF8D1;color:#1B1740}
#joke .who{font-size:40px;line-height:1}
#joke .x{margin-left:auto;background:none;font-size:20px;color:#1B1740}
@keyframes slidein{from{transform:translateY(120%)}}
.confetti{position:fixed;top:-20px;font-size:26px;z-index:60;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.cert{border:6px double var(--line);background:linear-gradient(#FFFBEA,#FFE9A8);color:#1B1740;border-radius:26px;padding:24px;text-align:center}
.check{display:flex;align-items:center;gap:10px;padding:8px 12px;border:3px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;direction:rtl;font-family:'Noto Naskh Arabic';font-size:21px;font-weight:700}
.check.on{background:var(--lime);color:#1B1740}
.check .bx{width:30px;height:30px;border:3px solid var(--line);border-radius:8px;display:grid;place-items:center;background:#fff;flex:none;color:#1B1740}
.fade{animation:fadein .35s}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}
</style>
<script src="audio.js"></script>
</head><body>

<div id="app"></div>

<div class="ov" id="gate"><div class="card">
  <div style="font-size:56px">✋</div>
  <h2>Wait! Mohamed will explain this first</h2>
  <div class="big-ar" style="font-size:28px">استنّى! الأستاذ محمد رح يشرحلك قبل ما نكمّل</div>
  <p class="hint">Teacher code to continue</p>
  <input id="code" class="codebox" inputmode="numeric" maxlength="4" autocomplete="off">
  <div class="row c" style="margin-top:12px"><button class="btn lime" id="gateGo">Continue ▶</button></div>
  <p id="gateMsg" class="hint"></p>
</div></div>

<div class="ov" id="pop"><div class="card" id="popIn"></div></div>
<div id="joke"><div class="card"><div class="who" id="jWho">🦜</div><div><b id="jName">Za'tar</b><div id="jTxt"></div></div><button class="x" onclick="hideJoke()">✕</button></div></div>

<script>
/* ============ DATA ============ */
const TEACHER_CODE='2468';
const SVG_BRACELET='<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="20" fill="none" stroke="#1B1740" stroke-width="4"/>'+[0,1,2,3,4,5,6,7].map(i=>{const a=i*Math.PI/4;return `<circle cx="${30+20*Math.cos(a)}" cy="${30+20*Math.sin(a)}" r="6" fill="${['#FF4D8D','#FFD23F','#3AB8FF','#7BD23A'][i%4]}" stroke="#1B1740" stroke-width="2"/>`}).join('')+'</svg>';
const SVG_KUNAFA='<svg viewBox="0 0 60 60"><ellipse cx="30" cy="38" rx="26" ry="12" fill="#C9C9D6" stroke="#1B1740" stroke-width="3"/><ellipse cx="30" cy="32" rx="22" ry="10" fill="#FF8A3D" stroke="#1B1740" stroke-width="3"/><circle cx="22" cy="30" r="2.5" fill="#7BD23A"/><circle cx="32" cy="28" r="2.5" fill="#7BD23A"/><circle cx="38" cy="33" r="2.5" fill="#7BD23A"/><circle cx="27" cy="35" r="2.5" fill="#7BD23A"/></svg>';
const ITEMS={
  pad:{ar:'إيد إكس بوكس',en:'Xbox controller',ic:'🎮'},
  ball:{ar:'طابة',en:'football',ic:'⚽'},
  shawarma:{ar:'شاورما',en:'shawarma',ic:'🌯'},
  bag:{ar:'شنطة',en:'bag',ic:'👜'},
  bracelet:{ar:'إسوارة',en:'bracelet',ic:SVG_BRACELET},
  flowers:{ar:'ورد',en:'flowers',ic:'💐'},
  headphones:{ar:'سمّاعات',en:'headphones',ic:'🎧'},
  watch:{ar:'ساعة',en:'watch',ic:'⌚'},
  kunafa:{ar:'كنافة',en:'kunafa',ic:SVG_KUNAFA},
};
const PLAYERS={
  hesham:{id:'hesham',ar:'هشام',en:'Hesham',g:'m',budget:50,mom:'m_h',
    list:[{k:'pad',start:40,fair:25},{k:'ball',start:20,fair:12},{k:'shawarma',start:15,fair:10}],
    goal:'an Xbox controller + a football + shawarma for the family'},
  lina:{id:'lina',ar:'لينا',en:'Lina',g:'f',budget:50,mom:'m_l',
    list:[{k:'bag',start:35,fair:22},{k:'bracelet',start:15,fair:9},{k:'flowers',start:10,fair:6}],
    goal:'a bag + a bracelet + flowers for Mama'},
  kareem:{id:'kareem',ar:'كريم',en:'Kareem',g:'m',budget:50,mom:'m_k',
    list:[{k:'headphones',start:35,fair:22},{k:'watch',start:20,fair:12},{k:'kunafa',start:15,fair:10}],
    goal:'headphones + a watch + kunafa for the family'},
};
const GUEST_LIST=[{k:'headphones',start:35,fair:22},{k:'ball',start:20,fair:12},{k:'kunafa',start:15,fair:10}];
const norm=t=>(t||'').replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,'').trim();
function findPlayer(name){const n=norm(name);if(n==='هشام'||n==='هاشم')return PLAYERS.hesham;if(n==='لينا'||n==='لينه')return PLAYERS.lina;if(n==='كريم')return PLAYERS.kareem;return null}
const PHR=[
  {id:'p_salam',ar:'السلام عليكم!',en:'Hello! (start polite)'},
  {id:'p_want',ar:'بدّي هاد، لو سمحت.',en:'I want this, please.'},
  {id:'p_price',ar:'قدّيش هاد؟',en:'How much is this?'},
  {id:'p_exp',ar:'غالي كتير!',en:'Too expensive!'},
  {id:'p_down',ar:'نزّللي شوي، لو سمحت.',en:'Bring it down a bit, please.'},
  {id:'p_last',ar:'آخِر سِعر؟',en:'Final price?'},
  {id:'p_give',ar:'بعطيك عشرين دينار.',en:"I'll give you 20 dinars."},
  {id:'p_have',ar:'معي بس عشرين دينار.',en:'I only have 20 dinars.'},
  {id:'p_bundle',ar:'إذا أخدت تنين، شو بتعمَلّي؟',en:'If I take two, what will you do for me?'},
  {id:'p_walk',ar:'لا خلص، بدوّر على محلّ تاني.',en:"No thanks, I'll look in another shop."},
  {id:'p_deal',ar:'ماشي، اتّفقنا!',en:'OK, deal!'},
  {id:'p_thanks',ar:'يعطيك العافية!',en:'Thank you (God give you strength)!'},
];
const SELL={
  s_hi_m:'أهلا وسهلا! تفضّل، شو بدّك؟',s_hi_f:'أهلا وسهلا! تفضّلي، شو بدّك؟',
  s_orig:'هاد أصلي، مية بالمية!',s_loss:'والله خسران فيها!',s_foryou:'عشانك بس… بنزّللك شوي.',
  s_come_m:'تعال تعال، ارجع!',s_come_f:'تعالي تعالي، ارجعي!',s_no:'لا لا، هيك كتير عليّ!',

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function beep(type){const a=ac();if(!a)return;const t=a.currentTime;const seq={coin:[[988,.07],[1319,.18]],good:[[523,.08],[659,.08],[784,.16]],bad:[[220,.18],[180,.22]],win:[[523,.1],[659,.1],[784,.1],[1047,.3]],tick:[[880,.05]]}[type]||[[440,.1]];let d=0;seq.forEach(([f,l])=>{const o=a.createOscillator(),g=a.createGain();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.18,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+l);o.connect(g);g.connect(a.destination);o.start(t+d);o.stop(t+d+l+.02);d+=l*.9})}
let cur=null;
function stopAudio(){if(cur){try{cur.pause()}catch(e){}cur=null}document.querySelectorAll('.talking').forEach(e=>e.classList.remove('talking'))}
let pendingId=null;

function showTapHint(){if($('#tapHint'))return;const d=document.createElement('div');d.id='tapHint';d.className='taphint';d.innerHTML='🔊 <span class="ar">اضغط في أي مكان عشان تسمع</span> · Tap anywhere for sound';document.body.appendChild(d)}
document.addEventListener('pointerdown',()=>{const h=$('#tapHint');if(h)h.remove();if(pendingId){const id=pendingId;pendingId=null;setTimeout(()=>play(id,$('#seller')),50)}},true);
/* step-by-step: after a sentence, wait for the child to repeat, then tap to hear the next one */
let gapRes=null;
function gap(repeatId,txt,ids){return new Promise(res=>{const old=$('#gapBar');if(old)old.remove();gapRes=res;hideJoke();

   <div class="row c"><button class="btn ghost" id="gapAgain">🔊 <span class="ar">كمان مرّة</span></button><button class="btn lime" id="gapNext"><span class="ar">التالي</span> ▶</button></div>`;
  document.body.appendChild(d);
  $('#gapAgain').onclick=()=>ids?sayIds(ids):play(repeatId);

async function seq(list){for(const [id,t] of list){await play(id,t);await wait(180)}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function pv(id){return P&&P.g==='f'?'g_'+id:id} // player-voice file
/* recording */
let rec=null,recChunks=[],lastRec={};
async function recToggle(btn,key){
  if(rec&&rec.state==='recording'){rec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);recChunks=[];
    rec.ondataavailable=e=>recChunks.push(e.data);
    rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());btn.classList.remove('on');lastRec[key]=URL.createObjectURL(new Blob(recChunks,{type:rec.mimeType||'audio/webm'}));const pb=btn.nextElementSibling;if(pb){pb.style.display='grid'}beep('tick')};
    rec.start();btn.classList.add('on');setTimeout(()=>{if(rec&&rec.state==='recording')rec.stop()},4000);
  }catch(e){toast('🎤 Mic not available — just say it out loud!')}
}
function recPlay(key){if(lastRec[key]){stopAudio();cur=new Audio(lastRec[key]);cur.play()}}
function phraseRow(p,withRec=true){

}

<script>
